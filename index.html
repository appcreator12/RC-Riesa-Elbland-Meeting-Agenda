let rowCounter = 0;

function eventRowHTML(e, i) {
  const dateStr = `${String(e.day).padStart(2,'0')}.${String(e.month).padStart(2,'0')}.${e.year||now.getFullYear()}`;
  const timeStr = e.time || (e.timeStart ? `${e.timeStart} – ${e.timeEnd}` : '');
  const loc = (e.loc || '').replace(/"/g, '&quot;');
  const thema = (e.thema !== undefined ? e.thema : e.title) || '';
  rowCounter = Math.max(rowCounter, i + 1);
  return `<tr id="erow-${i}" data-loc="${loc}">
    <td style="text-align:center;color:var(--muted);font-size:11px">${i+1}</td>
    <td><input class="et-input" value="${dateStr}" placeholder="TT.MM.JJJJ" id="edate-${i}"/></td>
    <td><input class="et-input" value="${timeStr}" placeholder="19:00 – 21:00" id="etime-${i}" style="min-width:110px"/></td>
    <td>
      <input class="et-input" value="${e.title}" placeholder="Veranstaltungsname" id="etitle-${i}" style="min-width:160px"/>
      ${loc ? `<div style="font-size:10.5px;color:var(--muted);padding:2px 6px 0">📍 ${loc}</div>` : ''}
    </td>
    <td><input class="et-input" value="${thema}" placeholder="Thema" id="ethema-${i}" style="min-width:160px"/></td>
    <td><button class="et-del" onclick="deleteEventRow(${i})" title="Zeile löschen">✕</button></td>
  </tr>`;
}

function addEventRow() {
  const tbody = document.getElementById('event-tbody');
  if (!tbody) return;
  const i = rowCounter++;
  const row = document.createElement('tr');
  row.id = `erow-${i}`;
  row.innerHTML = `
    <td style="text-align:center;color:var(--muted);font-size:11px">${i+1}</td>
    <td><input class="et-input" value="" placeholder="TT.MM.JJJJ" id="edate-${i}"/></td>
    <td><input class="et-input" value="" placeholder="19:00" id="etime-${i}"/></td>
    <td><input class="et-input" value="" placeholder="Veranstaltungsname" id="etitle-${i}" style="min-width:160px"/></td>
    <td><input class="et-input" value="" placeholder="Thema" id="ethema-${i}" style="min-width:160px"/></td>
    <td><button class="et-del" onclick="deleteEventRow(${i})" title="Zeile löschen">✕</button></td>`;
  tbody.appendChild(row);
  row.querySelector('.et-input').focus();
  updateModalCount();
}

function deleteEventRow(i) {
  const row = document.getElementById('erow-'+i);
  if (row) { row.remove(); updateModalCount(); }
}

function toggleItem(i, cb) {
  pendingItems[i]._excluded = !cb.checked;
  document.getElementById('pi-'+i)?.classList.toggle('unchecked', !cb.checked);
  updateModalCount();
}

function updateModalCount() {
  let count = 0;
  if (modalMode === 'birthdays') {
    count = pendingItems.filter(i => !i._excluded).length;
    const manual = document.getElementById('manual-entries')?.value.trim();
    if (manual) count += manual.split('\n').filter(l=>l.trim()).length;
  } else {
    count = document.querySelectorAll('#event-tbody tr').length;
  }
  document.getElementById('modal-count').textContent =
    `${count} Einträge werden importiert`;
}

function confirmImport() {
  if (modalMode === 'birthdays') {
    // Collect checked items + manual entries
    const manualText = document.getElementById('manual-entries')?.value || '';
    const manual = manualText.trim().split('\n').flatMap(line => {
      line = line.trim(); if (!line) return [];
      const parts = line.split(/[·|]/).map(p=>p.trim());
      if (parts.length < 2) return [];
      const d = parseDate(parts[1]);
      return d ? [{ name: parts[0], ...d }] : [];
    });
    const confirmed = pendingItems.filter(i => !i._excluded).concat(manual);
    if (!confirmed.length) { toast('Keine Einträge ausgewählt'); return; }
    data.birthdays = confirmed;
    saveData();
    const el = document.getElementById('bday-list');
    if (el) el.innerHTML = renderBirthdays(confirmed) +
      `<div class="data-watermark">${wheelSvg('currentColor','100%')}</div>`;
    toast(`✓ ${confirmed.length} Geburtstage importiert`);

  } else {
    // Collect all table rows
    const rows = document.querySelectorAll('#event-tbody tr');
    const confirmed = [];
    rows.forEach(row => {
      const id    = row.id.replace('erow-','');
      const dateV = document.getElementById('edate-'+id)?.value.trim()  || '';
      const timeV = document.getElementById('etime-'+id)?.value.trim()  || '';
      const title = document.getElementById('etitle-'+id)?.value.trim() || '';
      const thema = document.getElementById('ethema-'+id)?.value.trim() || '';
      const loc   = row.dataset.loc || '';
      if (!title) return;
      const d = parseDate(dateV);
      if (d) confirmed.push({ title, thema, ...d, time: timeV, loc });
      else if (title) confirmed.push({ title, thema, day:1, month:1, year:now.getFullYear(), time:timeV, loc });
    });
    if (!confirmed.length) { toast('Keine Termine eingetragen'); return; }
    data.events = confirmed.sort((a,b) => new Date(a.year,a.month-1,a.day) - new Date(b.year,b.month-1,b.day));
    saveData();
    const el = document.getElementById('events-list');
    if (el) el.innerHTML = renderEvents(data.events) +
      `<div class="data-watermark">${wheelSvg('currentColor','100%')}</div>`;
    toast(`✓ ${confirmed.length} Termine importiert`);
  }
  closeModal();
}

function closeModal() {
  document.getElementById('import-modal').classList.remove('open');
  pendingItems = []; modalMode = null; rowCounter = 0;
}


// ── ±14-DAY BIRTHDAY WINDOW ───────────────────────────────────
function daysUntilBirthday(day, month) {
  const today = new Date(); today.setHours(0,0,0,0);
  const yr = today.getFullYear();
  let bday = new Date(yr, month-1, day);
  let diff = Math.round((bday - today) / 86400000);
  if (diff < -28) { bday = new Date(yr+1, month-1, day); diff = Math.round((bday - today) / 86400000); }
  return diff;
}

// ── BIRTHDAY DISPLAY (4 weeks past / 2 weeks future window, with photos) ──
function renderBirthdays(list) {
  if (!list || list.length === 0) {
    return `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <p>Noch keine Geburtstagsliste importiert.</p>
      <span class="hint">Im Bearbeitungsmodus PDF importieren.</span>
    </div>`;
  }

  // Calculate days until/since each birthday and filter -28..+14 days
  const windowed = list
    .map(b => ({ ...b, diff: daysUntilBirthday(b.day, b.month) }))
    .filter(b => b.diff >= -28 && b.diff <= 14)
    .sort((a,b) => a.diff - b.diff);

  if (!windowed.length) {
    // No birthdays in window — show next upcoming birthday
    const upcoming = list
      .map(b => ({ ...b, diff: daysUntilBirthday(b.day, b.month) }))
      .filter(b => b.diff > 0)
      .sort((a,b) => a.diff - b.diff);
    const next = upcoming[0];
    return `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <p>Keine Geburtstage im Anzeigezeitraum.</p>
      ${next ? `<span class="hint">Nächster: ${next.name} in ${next.diff} Tagen (${next.day}. ${MONTHS[next.month-1]})</span>` : ''}
    </div>`;
  }

  // Group: past (negative diff), today (0), upcoming (positive)
  const past     = windowed.filter(b => b.diff < 0);
  const today    = windowed.filter(b => b.diff === 0);
  const upcoming = windowed.filter(b => b.diff > 0);

  function bdayCard(b, cls = '') {
    const age      = b.year ? now.getFullYear() - b.year + (b.diff > 0 ? 1 : 0) : 0;
    const avatar   = b.photo
      ? `<img src="${b.photo}" class="bday-avatar bday-photo" alt="${b.name}"/>`
      : `<div class="bday-avatar">${b.initials || b.name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase()}</div>`;
    const diffLabel = b.diff === 0 ? '🎂 Heute!'
      : b.diff > 0 ? `in ${b.diff} Tag${b.diff===1?'':'en'}`
      : `vor ${Math.abs(b.diff)} Tag${Math.abs(b.diff)===1?'':'en'}`;
    const diffCls = b.diff === 0 ? 'bday-badge' : b.diff > 0 ? 'bday-soon' : 'bday-past-label';
    return `<div class="bday-item ${cls}">
      ${avatar}
      <div style="flex:1;min-width:0">
        <div class="bday-name">${b.name}</div>
        <div class="bday-date">${b.day}. ${MONTHS[b.month-1]}${age ? ' · ' + age + '. Geburtstag' : ''}</div>
      </div>
      <span class="${diffCls}">${diffLabel}</span>
    </div>`;
  }

  let html = '';
  if (today.length) {
    html += `<div class="data-section-label" style="color:var(--gold)">🎉 Heute Geburtstag!</div>`;
    today.forEach(b => { html += bdayCard(b, 'today'); });
  }
  if (upcoming.length) {
    html += `<div class="data-section-label" style="margin-top:${today.length?'10px':'0'}">Bevorstehend — nächste 2 Wochen</div>`;
    upcoming.forEach(b => { html += bdayCard(b, 'this-month'); });
  }
  if (past.length) {
    html += `<div class="data-section-label" style="margin-top:8px;opacity:.6">Vergangene — letzte 4 Wochen</div>`;
    past.slice().reverse().forEach(b => { html += bdayCard(b, 'bday-past'); });
  }
  return html;
}

// ── EVENTS DISPLAY ────────────────────────────────────────────
function renderEvents(list) {
  if (!list || list.length === 0) {
    return `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <p>Noch keine Termine importiert.</p>
      <span class="hint">Im Bearbeitungsmodus PDF importieren.</span>
    </div>`;
  }
  // Use current date at render time (not the startup `now`) so auto-refresh works
  const today = new Date(); today.setHours(0,0,0,0);
  const toDate = e => new Date(e.year || today.getFullYear(), e.month-1, e.day);
  const upcoming = list.filter(e => toDate(e) >= today).sort((a,b) => toDate(a)-toDate(b));
  const past     = list.filter(e => toDate(e) <  today).sort((a,b) => toDate(b)-toDate(a)); // newest first

  function eventCard(e, cls = '', extra = '') {
    const meta  = [e.time, e.loc ? `📍 ${e.loc}` : ''].filter(Boolean).join('  ·  ');
    const thema = (e.thema && e.thema !== e.title) ? e.thema : '';
    return `<div class="event-item ${cls}" ${extra}>
      <div class="event-date-block">
        <div class="eday">${e.day}</div>
        <div class="emon">${MONTHS_SHORT[e.month-1]}</div>
      </div>
      <div class="event-info">
        <div class="event-title">${e.title}</div>
        ${thema ? `<div class="event-thema">📌 Thema: ${thema}</div>` : ''}
        <div class="event-meta">${meta}</div>
      </div>
    </div>`;
  }

  let html = '';

  // 1 past event at TOP — grayed out
  if (past.length) {
    html += `<div class="data-section-label" style="opacity:.5">Zuletzt vergangen</div>`;
    html += eventCard(past[0], '', 'style="opacity:.45"');
  }

  // Upcoming events below — next is gold-highlighted
  if (upcoming.length) {
    html += `<div class="data-section-label"${past.length ? ' style="margin-top:8px"' : ''}>Kommende Termine</div>`;
    upcoming.forEach((e, i) => {
      html += eventCard(e, i === 0 ? 'upcoming' : '');
    });
  }

  return html;
}

    `font-size:${o.fs || DEFAULT_PT * PT}px`,
    o.ff ? `font-family:${String(o.ff).replace(/"/g, "'")}` : '',
    o.color ? `color:${o.color}` : '',
    `line-height:${o.lh || 1.25}`,
  ].filter(Boolean).join(';');
}
function handlesHTML(list) { return list.map(h => `<div class="hdl hdl-${h}" data-h="${h}"></div>`).join(''); }

function objHTML(o, i) {
  const geo = `left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;z-index:${i + 1}`;
  if (o.type === 'image') {
    const src = _imgCache[o.imgId] || '';
    return `<div class="obj obj-img${o.plain ? ' plain' : ''}" id="${o.id}" data-id="${o.id}" style="${geo}">` +
      (src ? `<img src="${src}" alt="" draggable="false"/>` : '') +
      handlesHTML(['nw', 'ne', 'se', 'sw']) + `</div>`;
  }
  return `<div class="obj obj-text" id="${o.id}" data-id="${o.id}" style="${geo}">` +
    `<div class="tb-grip" title="Textfeld verschieben">${ICON_MOVE}Verschieben</div>` +
    `<div class="tb-content" contenteditable="${editMode ? 'true' : 'false'}" spellcheck="${editMode}" ` +
    `data-ph="Text hier eingeben …" style="${escAttr(textStyle(o))}">${o.html || ''}</div>` +
    handlesHTML(['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) + `</div>`;
}

function renderCanvas(sid) {
  const cv = document.getElementById('canvas-' + sid);
  if (!cv) return;
  cv.innerHTML = slideObjs(sid).map(objHTML).join('') + '<div class="guide gv"></div><div class="guide gh"></div>';
  cv.querySelectorAll('.tb-content').forEach(b => { updateEmpty(b); refreshMarkers(b); });
  if (sel && sel.sid === sid) {
    const el = document.getElementById(sel.id);
    if (el) el.classList.add('selected'); else sel = null;
  }
  if (editingBox && !editingBox.isConnected) editingBox = null;
}
function applyGeom(el, o) {
  el.style.left = o.x + 'px'; el.style.top = o.y + 'px';
  el.style.width = o.w + 'px'; el.style.height = o.h + 'px';
}
function updateEmpty(box) {
  const empty = !box.textContent.replace(/​/g, '').trim() && !box.querySelector('img,li');
  box.classList.toggle('is-empty', empty);
}
function selectedObj() { return sel ? findObj(sel.sid, sel.id) : null; }
function currentNormalSid() {
  const a = AGENDA[current - 2];
  return a && a.type === 'normal' ? a.id : null;
}

function selectObj(sid, id) {
  document.querySelectorAll('.obj.selected').forEach(el => el.classList.remove('selected'));
  sel = (sid && id) ? { sid, id } : null;
  if (sel) document.getElementById(id)?.classList.add('selected');
  updateRibbon();
}
function blurText() {
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains('tb-content')) ae.blur();
}

// ── Insert pictures ───────────────────────────────────────────
function processImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject('⚠ Datei konnte nicht gelesen werden');
    reader.onload = ev => {
      const img = new Image();
      img.onerror = () => reject(/\.hei[cf]$/i.test(file.name || '') || /hei[cf]/i.test(file.type || '')
        ? '⚠ HEIC-Format wird nicht unterstützt – bitte als JPG speichern'
        : '⚠ Bild konnte nicht geladen werden');
      img.onload = () => {
        const w0 = img.naturalWidth, h0 = img.naturalHeight;
        if (!w0 || !h0) return reject('⚠ Ungültiges Bild');
        const k = Math.min(1, 1800 / Math.max(w0, h0));
        const w = Math.round(w0 * k), h = Math.round(h0 * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        // Keep transparency (logos, PNG graphics); photos become compact JPEGs
        let alpha = false;
        if (!/jpe?g/i.test(file.type || '')) {
          try {
            const t = document.createElement('canvas'); t.width = Math.min(w, 64); t.height = Math.min(h, 64);
            const tc = t.getContext('2d'); tc.drawImage(img, 0, 0, t.width, t.height);
            const d = tc.getImageData(0, 0, t.width, t.height).data;
            for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { alpha = true; break; }
          } catch (e) {}
        }
        resolve({ dataURL: alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.86), ar: w0 / h0, alpha });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function placeImage(sid, imgId, ar, at, plain) {
  const objs = slideObjs(sid);
  const texts = objs.filter(o => o.type === 'text'), imgs = objs.filter(o => o.type === 'image');
  let w = 460, h = w / ar;
  if (h > 380) { h = 380; w = h * ar; }
  let x, y;
  if (at) {
    x = at.x - w / 2; y = at.y - h / 2;
  } else if (texts.length === 1 && !imgs.length && texts[0].w > 900) {
    // Smart layout: text on the left, picture on the right — nothing covers the text
    const t = texts[0];
    t.x = MARGIN; t.w = 700;
    const colX = MARGIN + 700 + 32, colW = CANVAS_W - MARGIN - colX;
    w = colW; h = w / ar;
    const maxH = CANVAS_H - 56;
    if (h > maxH) { h = maxH; w = h * ar; }
    x = colX + (colW - w) / 2; y = (CANVAS_H - h) / 2;
  } else {
    // Keep new pictures in the free column right of the text, stacked below each other
    const textRight = texts.length ? Math.max(...texts.map(t => t.x + t.w)) : CANVAS_W;
    const colX = textRight + 32, colW = CANVAS_W - MARGIN - colX;
    if (texts.length && colW >= 260) {
      w = Math.min(w, colW); h = w / ar;
      if (h > CANVAS_H - 56) { h = CANVAS_H - 56; w = h * ar; }
      x = colX + (colW - w) / 2;
      const inCol = imgs.filter(o => o.x >= colX - 40);
      const bottom = inCol.length ? Math.max(...inCol.map(o => o.y + o.h)) : 0;
      y = !inCol.length ? 28 : (bottom + 16 + h <= CANVAS_H - 12 ? bottom + 16 : 28 + (inCol.length % 6) * 28);
    } else {
      const k = imgs.length % 6;
      x = CANVAS_W - MARGIN - w - k * 28; y = 28 + k * 28;
    }
  }
  w = Math.min(w, CANVAS_W); h = Math.min(h, CANVAS_H);
  const o = { id: newId(), type: 'image', imgId, ar,
              x: Math.round(clamp(x, 0, CANVAS_W - w)), y: Math.round(clamp(y, 0, CANVAS_H - h)),
              w: Math.round(w), h: Math.round(h) };
  if (plain) o.plain = true;
  objs.push(o);
  return o;
}

async function insertImageFiles(sid, files, at) {
  files = [...(files || [])].filter(f => f && (/^image\//.test(f.type || '') || /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(f.name || '')));
  if (!files.length) { toast('⚠ Keine Bilddatei erkannt'); return; }
  if (!editMode) toggleEdit(true);
  let pushed = false, added = 0, lastId = null;
  for (const f of files) {
    let res;
    try { res = await processImageFile(f); } catch (msg) { toast(msg); continue; }
    const imgId = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    try { await idbPut(imgId, res.dataURL); }
    catch (e) { toast('⚠ Bild konnte nicht gespeichert werden'); continue; }
    if (!pushed) { pushHistory(sid); pushed = true; }
    const o = placeImage(sid, imgId, res.ar, at, res.alpha);
    if (at) at = { x: at.x + 24, y: at.y + 24 };
    lastId = o.id; added++;
  }
  if (!added) return;
  renderCanvas(sid);
  selectObj(sid, lastId);
  scheduleSave();
  toast(added > 1 ? `${added} Bilder eingefügt ✓` : 'Bild eingefügt ✓  Ziehen = verschieben · Ecken = Größe');
}

function insertTextBox(sid) {
  pushHistory(sid);
  const objs = slideObjs(sid);
  const k = objs.filter(o => o.type === 'text').length % 5;
  const o = { id: newId(), type: 'text', x: 340 + k * 24, y: 200 + k * 24, w: 600, h: 150, html: '' };
  const main = objs.find(t => t.type === 'text' && t.html && t.html.replace(/<[^>]*>/g, '').trim());
  const house = houseTextStyle(null);
  const fs = (main && main.fs) || house.fs;
  if (fs && Math.abs(fs - DEFAULT_PT * PT) > 0.5) o.fs = fs;
  if ((main && main.ff) || house.ff) o.ff = (main && main.ff) || house.ff;
  objs.push(o);
  renderCanvas(sid);
  selectObj(sid, o.id);
  document.querySelector('#' + o.id + ' .tb-content')?.focus();
  scheduleSave();
}

function arrange(cmd) {
  const o = selectedObj();
  if (!o) return;
  const sid = sel.sid, objs = slideObjs(sid), i = objs.indexOf(o);
  blurText();
  if (cmd === 'delete') {
    pushHistory(sid); objs.splice(i, 1); sel = null; editingBox = null;
    renderCanvas(sid); scheduleSave(); updateRibbon(); return;
  }
  if (cmd === 'duplicate') {
    pushHistory(sid);
    const c = JSON.parse(JSON.stringify(o));
    c.id = newId(); c.x = clamp(o.x + 24, 0, CANVAS_W - o.w); c.y = clamp(o.y + 24, 0, CANVAS_H - o.h);
    objs.push(c); renderCanvas(sid); selectObj(sid, c.id); scheduleSave(); return;
  }
  if (cmd === 'front') { if (i === objs.length - 1) return; pushHistory(sid); objs.splice(i, 1); objs.push(o); }
  if (cmd === 'back')  { if (i === 0) return;               pushHistory(sid); objs.splice(i, 1); objs.unshift(o); }
  renderCanvas(sid); selectObj(sid, o.id); scheduleSave();
}

// ── Pointer: select, move, resize, smart guides ───────────────
function onStagePointerDown(e) {
  if (!editMode) return;
  if (e.button !== undefined && e.button > 0) return;
  const cv = e.target.closest('.canvas');
  if (!cv) { if (sel) { blurText(); selectObj(null); } return; }
  const sid = cv.dataset.slide;
  const objEl = e.target.closest('.obj');
  if (!objEl) { blurText(); selectObj(null); return; }
  const o = findObj(sid, objEl.dataset.id);
  if (!o) return;
  const hdl = e.target.closest('.hdl');
  if (!hdl && o.type === 'text' && e.target.closest('.tb-content')) {
    if (!sel || sel.id !== o.id) selectObj(sid, o.id);
    return;                                   // let the browser place the caret
  }
  e.preventDefault();
  blurText();
  selectObj(sid, o.id);
  drag = {
    sid, o, el: objEl, cv,
    mode: hdl ? 'resize' : 'move', h: hdl ? hdl.dataset.h : null,
    sx: e.clientX, sy: e.clientY,
    start: { x: o.x, y: o.y, w: o.w, h: o.h },
    started: false,
  };
  try { objEl.setPointerCapture(e.pointerId); } catch (err) {}
}

function onPointerMove(e) {
  if (!drag) return;
  const dx = (e.clientX - drag.sx) / stageScale, dy = (e.clientY - drag.sy) / stageScale;
  if (!drag.started) {
    if (Math.hypot(dx, dy) < 3) return;
    drag.started = true;
    pushHistory(drag.sid);
    drag.el.classList.add('dragging');
  }
  let r;
  if (drag.mode === 'move') {
    r = { ...drag.start, x: drag.start.x + dx, y: drag.start.y + dy };
    if (!e.altKey) r = snapMove(r); else showGuides(null, null);
    r.x = clamp(r.x, 0, CANVAS_W - r.w);
    r.y = clamp(r.y, 0, CANVAS_H - r.h);
  } else {
    r = resizeRect(dx, dy, e.shiftKey);
  }
  drag.o.x = Math.round(r.x); drag.o.y = Math.round(r.y);
  drag.o.w = Math.round(r.w); drag.o.h = Math.round(r.h);
  applyGeom(drag.el, drag.o);
}

function onPointerUp() {
  if (!drag) return;
  if (drag.started) {
    drag.el.classList.remove('dragging');
    showGuides(null, null);
    scheduleSave();
  }
  drag = null;
}

function resizeRect(dx, dy, shift) {
  const s = drag.start, hd = drag.h, o = drag.o;
  const corner = hd.length === 2;
  const lock = o.type === 'image' ? corner : (shift && corner);
  const MINW = 40, MINH = 24;
  const ax = hd.includes('w') ? s.x + s.w : s.x;          // fixed anchor
  const ay = hd.includes('n') ? s.y + s.h : s.y;
  const maxW = hd.includes('w') ? ax : CANVAS_W - ax;
  const maxH = hd.includes('n') ? ay : CANVAS_H - ay;
  let w = s.w, h = s.h;
  if (hd.includes('e')) w = s.w + dx;
  if (hd.includes('w')) w = s.w - dx;
  if (hd.includes('s')) h = s.h + dy;
  if (hd.includes('n')) h = s.h - dy;
  if (lock) {
    const ar = s.w / s.h;
    if (Math.abs(w / s.w - 1) >= Math.abs(h / s.h - 1)) h = w / ar; else w = h * ar;
    if (w < MINW) { w = MINW; h = w / ar; }
    if (w > maxW) { w = maxW; h = w / ar; }
    if (h > maxH) { h = maxH; w = h * ar; }
  } else {
    if (hd.includes('e') || hd.includes('w')) w = clamp(w, MINW, maxW);
    if (hd.includes('n') || hd.includes('s')) h = clamp(h, MINH, maxH);
  }
  return {
    x: hd.includes('w') ? ax - w : s.x,
    y: hd.includes('n') ? ay - h : s.y,
    w, h,
  };
}

function snapMove(r) {
  const T = 6;
  const xs = [0, MARGIN, CANVAS_W / 2, CANVAS_W - MARGIN, CANVAS_W];
  const ys = [0, 28, CANVAS_H / 2, CANVAS_H - 28, CANVAS_H];
  slideObjs(drag.sid).forEach(o => {
    if (o === drag.o) return;
    xs.push(o.x, o.x + o.w / 2, o.x + o.w);
    ys.push(o.y, o.y + o.h / 2, o.y + o.h);
  });
  const best = (pos, size, targets) => {
    let b = null;
    [0, size / 2, size].forEach(off => targets.forEach(t => {
      const d = t - (pos + off);
      if (Math.abs(d) <= T && (!b || Math.abs(d) < Math.abs(b.d))) b = { d, line: t };
    }));
    return b;
  };
  const bx = best(r.x, r.w, xs), by = best(r.y, r.h, ys);
  if (bx) r.x += bx.d;
  if (by) r.y += by.d;
  showGuides(bx ? bx.line : null, by ? by.line : null);
  return r;
}
function showGuides(gx, gy) {
  const cv = drag ? drag.cv : null;
  document.querySelectorAll('.guide').forEach(g => g.style.display = 'none');
  if (!cv) return;
  const v = cv.querySelector('.guide.gv'), h = cv.querySelector('.guide.gh');
  if (gx !== null && v) { v.style.left = gx + 'px'; v.style.display = 'block'; }
  if (gy !== null && h) { h.style.top = gy + 'px'; h.style.display = 'block'; }
}

function nudge(dx, dy) {
  const o = selectedObj(); if (!o) return;
  if (Date.now() - (nudge.last || 0) > 800) pushHistory(sel.sid);
  nudge.last = Date.now();
  o.x = clamp(o.x + dx, 0, CANVAS_W - o.w);
  o.y = clamp(o.y + dy, 0, CANVAS_H - o.h);
  const el = document.getElementById(o.id); if (el) applyGeom(el, o);
  scheduleSave();
}

// ══════════════════════════════════════════════════════════════
//  TEXT FORMATTING  (works like PowerPoint)
//  • caret/selection inside a text box → applies to the selection
//    (caret inside a word → that word, like PowerPoint)
//  • text box selected via its frame   → applies to the whole box
// ══════════════════════════════════════════════════════════════
let _pendingTextSnap = null;
let _suppressFocusSnap = false;

function boxOf(n) {
  const el = n && (n.nodeType === 1 ? n : n.parentElement);
  return el && el.closest ? el.closest('.tb-content') : null;
}
function textTarget() {
  if (!editMode || !sel) return null;
  const o = selectedObj();
  if (!o || o.type !== 'text') return null;
  const box = document.getElementById(o.id)?.querySelector('.tb-content');
  if (!box) return null;
  // use the live caret when the box has focus (selectionchange events arrive asynchronously)
  const live = getSelection();
  if (document.activeElement === box && live.rangeCount && boxOf(live.getRangeAt(0).startContainer) === box) {
    savedRange = live.getRangeAt(0).cloneRange(); savedRangeBox = box;
  }
  const ranged = editingBox === box && savedRangeBox === box && savedRange &&
                 box.contains(savedRange.startContainer);
  return { sid: sel.sid, o, box, mode: ranged ? 'range' : 'all' };
}
function commitTextFromBox(box) {
  const objEl = box.closest('.obj'), cv = box.closest('.canvas');
  if (!objEl || !cv) return;
  const o = findObj(cv.dataset.slide, objEl.dataset.id);
  if (!o) return;
  const html = box.innerHTML;
  if (o.html !== html) { o.html = html; scheduleSave(); }
}
function applyBoxStyle(t) { t.box.setAttribute('style', textStyle(t.o)); }
function stripStyle(root, prop) {
  root.querySelectorAll('[style]').forEach(n => {
    n.style.removeProperty(prop);
    if (!n.getAttribute('style')) n.removeAttribute('style');
  });
}
function unwrap(el) { const p = el.parentNode; while (el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); }
function tidy(root) {
  root.querySelectorAll('span:not([style]):not([class]), font:not([size]):not([face]):not([color])').forEach(unwrap);
}
function expandToWord() {
  const s = getSelection();
  if (!s.rangeCount || !s.isCollapsed) return;
  const n = s.anchorNode, off = s.anchorOffset;
  if (!n || n.nodeType !== 3) return;
  const txt = n.textContent, W = /[\p{L}\p{N}_\-]/u;
  if (!(off > 0 && W.test(txt[off - 1]) && off < txt.length && W.test(txt[off]))) return;
  let a = off, b = off;
  while (a > 0 && W.test(txt[a - 1])) a--;
  while (b < txt.length && W.test(txt[b])) b++;
  const r = document.createRange(); r.setStart(n, a); r.setEnd(n, b);
  s.removeAllRanges(); s.addRange(r);
}

function selectsWholeBox(t) {
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed) return false;
  const norm = x => x.replace(/[\s\u200B]/g, '');
  const all = norm(t.box.textContent);
  return all.length > 0 && norm(s.toString()) === all;
}
function withText(fn, opts = {}) {
  const t = textTarget();
  if (!t) { toast('Bitte zuerst ein Textfeld anklicken'); return; }
  pushHistory(t.sid);
  const s = getSelection();
  const keep = t.mode === 'range' ? savedRange.cloneRange() : null;   // focusing may move the caret
  _suppressFocusSnap = true;
  t.box.focus({ preventScroll: true });
  _suppressFocusSnap = false;
  if (t.mode === 'range') {
    s.removeAllRanges(); s.addRange(keep); savedRange = keep.cloneRange();
    if (opts.word) expandToWord();
  } else {
    const r = document.createRange(); r.selectNodeContents(t.box);
    s.removeAllRanges(); s.addRange(r);
  }
  try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
  fn(t);
  _pendingTextSnap = null;
  tidy(t.box);
  refreshMarkers(t.box);
  commitTextFromBox(t.box);
  updateEmpty(t.box);
  if (t.mode === 'all') { s.removeAllRanges(); t.box.blur(); editingBox = null; }
  scheduleSave();
  updateRibbon();
}

function fmtToggle(cmd) { withText(() => document.execCommand(cmd, false, null), { word: true }); }
function fmtBlock(cmd) {
  withText(t => {
    // Numbering button on a numbered line → remove its number, keep the rest of the list counting on
    if (cmd === 'insertOrderedList' && t.mode === 'range' && unnumberItem(t.box)) return;
    document.execCommand(cmd, false, null);
  });
}

// ── LIST MARKERS (numbers/bullets formatted like the first character of the line) ──
const ROMAN = [[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];
function fmtListNumber(n, type) {
  if (type === 'lower-alpha' || type === 'upper-alpha') {
    if (n < 1) return String(n);
    let out = '', x = n;
    while (x > 0) { x--; out = String.fromCharCode(97 + x % 26) + out; x = Math.floor(x / 26); }
    return type === 'upper-alpha' ? out.toUpperCase() : out;
  }
  if (type === 'lower-roman' || type === 'upper-roman') {
    if (n < 1 || n > 3999) return String(n);
    let out = '', x = n;
    for (const [v, r] of ROMAN) while (x >= v) { out += r; x -= v; }
    return type === 'upper-roman' ? out.toUpperCase() : out;
  }
  return String(n);
}
function listFormatOf(ol) {
  if (ol.style.listStyleType) return ol.style.listStyleType;
  let depth = 0;
  for (let p = ol.parentElement; p && !p.classList.contains('tb-content'); p = p.parentElement) if (p.tagName === 'OL') depth++;
  return ['decimal', 'lower-alpha', 'lower-roman'][depth % 3];
}
function firstTextIn(li) {
  const list = li.parentElement;
  const tw = document.createTreeWalker(li, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.textContent.replace(/\u200B/g, '').trim() && n.parentElement.closest('ol,ul') === list
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP });
  return tw.nextNode();
}
function refreshMarkers(box) {
  if (!box || !box.querySelector('li')) return;
  const boxColor = getComputedStyle(box).color;
  box.querySelectorAll('li').forEach(li => {
    const list = li.parentElement;
    if (!list || (list.tagName !== 'OL' && list.tagName !== 'UL')) return;
    const label = list.tagName === 'OL' ? fmtListNumber(itemNumber(li), listFormatOf(list)) + '.' : '•';
    if (li.getAttribute('data-n') !== label) li.setAttribute('data-n', label);
    const tn = firstTextIn(li);
    const el = tn ? tn.parentElement : li;
    const cs = getComputedStyle(el);
    const deco = new Set();
    for (let e = el; e && e !== list; e = e.parentElement) {
      const d = getComputedStyle(e).textDecorationLine || '';
      if (d.includes('underline')) deco.add('underline');
      if (d.includes('line-through')) deco.add('line-through');
    }
    const props = {
      '--mk-w': cs.fontWeight, '--mk-i': cs.fontStyle, '--mk-d': [...deco].join(' ') || 'none',
      '--mk-s': cs.fontSize, '--mk-f': cs.fontFamily, '--mk-c': cs.color,
    };
    if (list.tagName === 'UL' && cs.color === boxColor) props['--mk-c'] = '';   // bullets stay gold
    Object.entries(props).forEach(([k, v]) => {
      if (li.style.getPropertyValue(k) === v) return;
      if (v) li.style.setProperty(k, v); else li.style.removeProperty(k);
    });
    if (!li.getAttribute('style')) li.removeAttribute('style');
  });
}

// ── NUMBERED LISTS (PowerPoint/Word-like control over the numbers) ──
function listItemAt(node, box) {
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  const li = el && el.closest ? el.closest('li') : null;
  return li && box.contains(li) ? li : null;
}
function itemNumber(li) {
  const ol = li.parentElement;
  let n = ol.hasAttribute('start') ? parseInt(ol.getAttribute('start'), 10) || 1 : 1;
  for (const c of ol.children) {
    if (c.tagName !== 'LI') continue;
    if (c.hasAttribute('value')) n = parseInt(c.getAttribute('value'), 10) || 1;
    if (c === li) return n;
    n++;

}
function lastNumber(ol) {

  return items.length ? itemNumber(items[items.length - 1]) : (parseInt(ol.getAttribute('start'), 10) || 1) - 1;

  while (n) { if (n.nodeType === 1 && n.tagName === 'OL') return n; n = n.previousSibling; }
  return null;
}
function nextListAfter(node, box) {

  while (node && node.parentNode !== box) node = node.parentNode;
  let n = node ? node.nextSibling : null, steps = 0;
  while (n && steps < 6) {
    if (n.nodeType === 1 && n.tagName === 'OL') return n;
    if (n.nodeType === 1 && n.tagName !== 'BR') return null;
    if (n.nodeType === 3 && n.textContent.trim()) return null;

}
// Remove the number of the line with the caret; the following items keep counting

  const n = itemNumber(li);
  const fmt = list.style.listStyleType;

  if (hasFollowing) {
    const next = nextListAfter(getSelection().anchorNode, box);
    if (next) {

      if (fmt) next.style.listStyleType = fmt;

}

  return { li: ol ? li : null, ol, all: ol ? [ol] : [...box.querySelectorAll(':scope > ol')] };
}

}

    c.all.forEach(ol => { if (fmt === 'decimal') ol.style.removeProperty('list-style-type'); else ol.style.listStyleType = fmt;

  });

}
function setListStart(n) {

    const c = ensureNumbered(t.box);
    c.all.forEach(ol => { if (n === 1) ol.removeAttribute('start'); else ol.setAttribute('start', n); });
  });
  fillNumberPop();
}
function setItemNumber(n) {
  const t = textTarget();
  if (!t || t.mode !== 'range') { toast('Bitte den Cursor in den nummerierten Punkt setzen'); return; }
  withText(tt => {
    const c = numberCtx(tt.box);
    if (!c.li) { toast('Bitte den Cursor in einen nummerierten Punkt setzen'); return; }
    const first = c.ol.querySelector(':scope > li');
    if (c.li === first) { if (n === 1) c.ol.removeAttribute('start'); else c.ol.setAttribute('start', n); c.li.removeAttribute('value'); }
    else c.li.setAttribute('value', n);
  });
  fillNumberPop();
}
function listAction(act) {
  withText(t => {
    const c = numberCtx(t.box);
    if (!c.ol) { toast('Bitte den Cursor in einen nummerierten Punkt setzen'); return; }
    if (act === 'remove') { unnumberItem(t.box); return; }
    if (act === 'restart') {
      if (c.li && c.li !== c.ol.querySelector(':scope > li')) c.li.setAttribute('value', 1);
      else { c.ol.removeAttribute('start'); c.ol.querySelector(':scope > li')?.removeAttribute('value'); }
      return;
    }
    if (act === 'continue') {
      const p = prevList(c.ol);
      if (!p) { toast('Darüber gibt es keine Liste zum Fortsetzen'); return; }
      c.ol.setAttribute('start', lastNumber(p) + 1);
      c.ol.querySelector(':scope > li')?.removeAttribute('value');

function fillNumberPop() {

    if (!ol) ol = t.box.querySelector(':scope > ol');

  if (document.activeElement !== startIn) startIn.value = ol ? (parseInt(ol.getAttribute('start'), 10) || 1) : '';
  if (document.activeElement !== itemIn) itemIn.value = li ? itemNumber(li) : '';
  itemIn.disabled = !li;
  const fmt = ol ? (ol.style.listStyleType || 'decimal') : '';
  document.querySelectorAll('#pop-number [data-olfmt]').forEach(b => b.classList.toggle('on', b.dataset.olfmt === fmt));
}

function setFontSizePx(px) {
  px = Math.round(clamp(px, 6, 400) * 100) / 100;
  withText(t => {
    if (t.mode === 'all' || selectsWholeBox(t)) {      // whole text → change the box's base size (line spacing follows)
      stripStyle(t.box, 'font-size');
      t.box.querySelectorAll('font[size]').forEach(f => f.removeAttribute('size'));
      t.o.fs = px; applyBoxStyle(t);
      return;
    }
    const s = getSelection();
    if (s.isCollapsed) {
      // caret between words → size applies to what is typed next
      const span = document.createElement('span');
      span.style.fontSize = px + 'px'; span.textContent = '​';
      s.getRangeAt(0).insertNode(span);
      const r = document.createRange(); r.setStart(span.firstChild, 1); r.collapse(true);
      s.removeAllRanges(); s.addRange(r);
      return;
    }
    document.execCommand('styleWithCSS', false, false);
    document.execCommand('fontSize', false, '7');
    document.execCommand('styleWithCSS', false, true);
    const spans = [];
    t.box.querySelectorAll('font[size="7"]').forEach(f => {
      f.querySelectorAll('[style]').forEach(n => {
        n.style.removeProperty('font-size');
        if (!n.getAttribute('style')) n.removeAttribute('style');
      });
      f.querySelectorAll('font[size]').forEach(n => n.removeAttribute('size'));
      const span = document.createElement('span');
      span.style.fontSize = px + 'px';
      if (f.getAttribute('face'))  span.style.fontFamily = f.getAttribute('face');
      if (f.getAttribute('color')) span.style.color = f.getAttribute('color');
      while (f.firstChild) span.appendChild(f.firstChild);
      f.replaceWith(span);
      spans.push(span);
    });
    if (spans.length) {
      const r = document.createRange();
      r.setStartBefore(spans[0]); r.setEndAfter(spans[spans.length - 1]);
      s.removeAllRanges(); s.addRange(r);
    }
  }, { word: true });
}
function currentPt() {
  const t = textTarget();
  if (!t) return DEFAULT_PT;
  const probe = probeElement(t);
  return Math.round(parseFloat(getComputedStyle(probe).fontSize) / PT * 2) / 2;
}
function growShrink(dir) {

  if (dir > 0) next = SIZE_STEPS.find(v => v > pt + 0.01) || pt + 8;
  else next = [...SIZE_STEPS].reverse().find(v => v < pt - 0.01) || Math.max(6, pt - 1);
  setFontSizePx(next * PT);
}
function setFontFamily(css) {
  withText(t => {
    if (t.mode === 'all' || selectsWholeBox(t)) {
      stripStyle(t.box, 'font-family');
      t.box.querySelectorAll('font[face]').forEach(f => f.removeAttribute('face'));
      t.o.ff = css; applyBoxStyle(t);
    } else {

    }
  }, { word: true });
}
let lastTextColor = '#C0392B', lastHilite = '#FFF176';
function setTextColor(c) {
  lastTextColor = c;
  document.getElementById('rb-color-bar').style.background = c;
  withText(t => {
    if (t.mode === 'all') {
      stripStyle(t.box, 'color');
      t.box.querySelectorAll('font[color]').forEach(f => f.removeAttribute('color'));
      t.o.color = c; applyBoxStyle(t);
    } else {
      document.execCommand('foreColor', false, c);
    }
  }, { word: true });
}
function setHilite(c) {
  if (c !== 'transparent') { lastHilite = c; document.getElementById('rb-hilite-bar').style.background = c; }
  withText(t => {
    if (c === 'transparent' && t.mode === 'all') { stripStyle(t.box, 'background-color'); return; }
    if (!document.execCommand('hiliteColor', false, c)) document.execCommand('backColor', false, c);
  }, { word: true });
}
function clearFormat() {
  withText(t => {
    if (t.mode === 'all') {
      t.box.querySelectorAll('[style]').forEach(n => {
        const align = n.style.textAlign;
        n.removeAttribute('style');
        if (align) n.style.textAlign = align;
      });
      t.box.querySelectorAll('b,strong,i,em,u,s,strike,font,span').forEach(unwrap);
      delete t.o.fs; delete t.o.ff; delete t.o.color;
      applyBoxStyle(t);

}
function setLineHeight(v) {

  pushHistory(t.sid);
  t.o.lh = parseFloat(v) || 1.25;
  applyBoxStyle(t);
  if (t.mode === 'range') {
    const keep = savedRange.cloneRange();
    _suppressFocusSnap = true; t.box.focus({ preventScroll: true }); _suppressFocusSnap = false;
    const s = getSelection(); s.removeAllRanges(); s.addRange(keep);
  }
  scheduleSave();
}

// ── Text events ───────────────────────────────────────────────
document.addEventListener('focusin', e => {
  const box = e.target.closest ? e.target.closest('.tb-content') : null;
  if (!box || !editMode) return;
  editingBox = box;
  const objEl = box.closest('.obj'), cv = box.closest('.canvas');
  if (objEl && cv && (!sel || sel.id !== objEl.dataset.id)) selectObj(cv.dataset.slide, objEl.dataset.id);
  if (!_suppressFocusSnap && cv) _pendingTextSnap = snapshot(cv.dataset.slide);
  updateRibbon();
});
document.addEventListener('focusout', e => {
  const box = e.target.closest ? e.target.closest('.tb-content') : null;
  if (!box) return;
  const to = e.relatedTarget;
  if (to && to.closest && to.closest('#topbar, .rb-pop')) return;   // focus moved into the ribbon
  commitTextFromBox(box);
  if (editingBox === box) editingBox = null;
  _pendingTextSnap = null;
  scheduleRibbon();
});
document.addEventListener('input', e => {
  const box = e.target.closest ? e.target.closest('.tb-content') : null;
  if (!box) return;
  if (_pendingTextSnap) { pushSnap(_pendingTextSnap); _pendingTextSnap = null; }
  refreshMarkers(box);
  commitTextFromBox(box);
  updateEmpty(box);
});
document.addEventListener('selectionchange', () => {
  if (!editMode) return;
  const s = getSelection();
  if (!s.rangeCount) return;
  const r = s.getRangeAt(0);
  const box = boxOf(r.startContainer);
  if (box && box === boxOf(r.endContainer)) {
    savedRange = r.cloneRange(); savedRangeBox = box;
    scheduleRibbon();
  }
});
document.addEventListener('dblclick', e => {
  if (!editMode) return;
  const objEl = e.target.closest('.obj-text');
  if (!objEl || e.target.closest('.tb-content')) return;
  const box = objEl.querySelector('.tb-content');
  box.focus();
  const r = document.createRange(); r.selectNodeContents(box); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
});

// ══════════════════════════════════════════════════════════════
//  UNDO / REDO  (per slide snapshots)
// ══════════════════════════════════════════════════════════════
const hist = [], redoStack = [];
function snapshot(sid) { return { sid, objs: JSON.stringify(slideObjs(sid)) }; }
function pushSnap(s) {
  hist.push(s);
  if (hist.length > 120) hist.shift();
  redoStack.length = 0;
  updateHistoryBtns();
}
function pushHistory(sid) { pushSnap(snapshot(sid)); }
function restoreSnap(s) {
  data['objs_' + s.sid] = JSON.parse(s.objs);
  const idx = AGENDA.findIndex(a => a.id === s.sid) + 2;
  const keep = sel && sel.sid === s.sid ? sel.id : null;
  sel = null; editingBox = null;
  if (current !== idx) showSlide(idx);
  renderCanvas(s.sid);
  if (keep && findObj(s.sid, keep)) selectObj(s.sid, keep); else updateRibbon();
  scheduleSave();
}
function undo() {
  blurText();
  const s = hist.pop(); if (!s) return;
  redoStack.push(snapshot(s.sid)); restoreSnap(s);
}
function redo() {
  blurText();
  const s = redoStack.pop(); if (!s) return;
  hist.push(snapshot(s.sid)); restoreSnap(s);
}
function updateHistoryBtns() {
  document.getElementById('rb-undo')?.classList.toggle('disabled', !hist.length && !editingBox);
  document.getElementById('rb-redo')?.classList.toggle('disabled', !redoStack.length);
}

// ══════════════════════════════════════════════════════════════
//  RIBBON
// ══════════════════════════════════════════════════════════════
let pendingImageTarget = null;     // 'title' or a slide id
function initRibbon() {
  const fontSel = document.getElementById('rb-font');
  fontSel.innerHTML = FONTS.map(f => `<option value="${escAttr(f.css)}" style="font-family:${escAttr(f.css)}">${f.label}</option>`).join('');
  document.getElementById('rb-sizes').innerHTML = SIZE_STEPS.map(v => `<option value="${String(v).replace('.', ',')}">`).join('');
  document.getElementById('sw-color').innerHTML = TEXT_COLORS.map(c => `<div class="sw" data-color="${c}" style="background:${c}" title="${c}"></div>`).join('');
  document.getElementById('sw-hilite').innerHTML = HILITE_COLORS.map(c =>
    `<div class="sw${c === 'transparent' ? ' none' : ''}" data-hilite="${c}" ${c === 'transparent' ? 'title="Keine Farbe"' : `style="background:${c}"`}></div>`).join('');
  document.getElementById('rb-color-bar').style.background = lastTextColor;

  const ribbon = document.getElementById('ribbon');
  ribbon.addEventListener('pointerdown', e => {
    if (e.target.closest('select, input')) return;
    e.preventDefault();                          // keep the text selection alive
    const b = e.target.closest('[data-cmd]');
    if (b && !b.classList.contains('disabled')) runCmd(b.dataset.cmd, b);
  });
  ribbon.addEventListener('click', e => {        // keyboard activation (Enter/Space)
    if (e.detail !== 0) return;
    const b = e.target.closest('[data-cmd]');
    if (b) runCmd(b.dataset.cmd, b);
  });
  fontSel.addEventListener('change', () => setFontFamily(fontSel.value));
  const size = document.getElementById('rb-size');
  size.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); size.blur(); } });
  size.addEventListener('change', () => {
    const v = parseFloat(String(size.value).replace(',', '.'));
    if (v > 0) setFontSizePx(v * PT);
  });
  document.getElementById('rb-lh').addEventListener('change', e => setLineHeight(e.target.value));

  document.querySelectorAll('.rb-pop').forEach(p => p.addEventListener('pointerdown', e => {
    if (!e.target.closest('input, label')) e.preventDefault();
    const c = e.target.closest('[data-color]'), h = e.target.closest('[data-hilite]');
    if (c) { closePops(); setTextColor(c.dataset.color); }
    if (h) { closePops(); setHilite(h.dataset.hilite); }
    const f = e.target.closest('[data-olfmt]'), a = e.target.closest('[data-olact]');
    if (f) setListFormat(f.dataset.olfmt);
    if (a) listAction(a.dataset.olact);
  }));
  ['ol-start', 'ol-item'].forEach(id => {
    const inp = document.getElementById(id);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
    inp.addEventListener('change', () => {
      const n = parseInt(inp.value, 10);
      if (!(n >= 0)) { fillNumberPop(); return; }
      id === 'ol-start' ? setListStart(n) : setItemNumber(n);
    });
  });
  document.getElementById('color-more').addEventListener('change', e => { closePops(); setTextColor(e.target.value); });
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.rb-pop, #rb-color, #rb-hilite, #rb-ol-more')) closePops();
  });

  const imgInput = document.getElementById('img-file-input');
  imgInput.addEventListener('change', () => {
    const files = [...imgInput.files];
    imgInput.value = '';
    if (!files.length) return;
    if (pendingImageTarget === 'title') handleTitleFile(files[0]);
    else if (pendingImageTarget) insertImageFiles(pendingImageTarget, files);
    pendingImageTarget = null;
  });
}

function runCmd(cmd, btn) {
  switch (cmd) {
    case 'insertImage': {
      if (current === 0) { triggerTitleUpload(); break; }
      const sid = currentNormalSid();
      if (!sid) { toast('Bilder können auf den Textfolien eingefügt werden (Begrüßung, Meetingthemen, Projekte, Vorstandssitzung)'); break; }
      pendingImageTarget = sid;
      document.getElementById('img-file-input').click();
      break;
    }
    case 'insertText': { const sid = currentNormalSid(); if (sid) insertTextBox(sid); break; }
    case 'grow': growShrink(1); break;
    case 'shrink': growShrink(-1); break;
    case 'bold': case 'italic': case 'underline': case 'strikeThrough': fmtToggle(cmd); break;
    case 'insertUnorderedList': case 'insertOrderedList': case 'indent': case 'outdent':
    case 'justifyLeft': case 'justifyCenter': case 'justifyRight': case 'justifyFull': fmtBlock(cmd); break;
    case 'popColor':  togglePop('pop-color', btn); break;
    case 'popHilite': togglePop('pop-hilite', btn); break;
    case 'popNumber': fillNumberPop(); togglePop('pop-number', btn); break;
    case 'clearFormat': clearFormat(); break;
    case 'front': case 'back': case 'duplicate': case 'delete': arrange(cmd); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
  }
}
function togglePop(id, btn) {
  const pop = document.getElementById(id);
  const open = pop.classList.contains('open');
  closePops();
  if (open) return;
  const r = btn.getBoundingClientRect();
  pop.classList.add('open');
  pop.style.left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 8) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
}
function closePops() { document.querySelectorAll('.rb-pop.open').forEach(p => p.classList.remove('open')); }

let _rbRaf = 0;
function scheduleRibbon() {
  if (_rbRaf) return;
  _rbRaf = requestAnimationFrame(() => { _rbRaf = 0; updateRibbon(); });
}
function probeElement(t) {
  if (t.mode === 'range') {
    let n = savedRange.startContainer;
    if (n.nodeType === 1 && n.childNodes[savedRange.startOffset]) n = n.childNodes[savedRange.startOffset];
    const el = n.nodeType === 1 ? n : n.parentElement;
    return el && t.box.contains(el) ? el : t.box;
  }
  const walker = document.createTreeWalker(t.box, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.textContent.replace(/​/g, '').trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP });
  const first = walker.nextNode();
  return first ? first.parentElement : t.box;
}
function setGroup(name, on) {
  document.querySelector(`.rb-group[data-group="${name}"]`)?.classList.toggle('disabled', !on);
}
function updateRibbon() {
  if (!editMode) return;
  const a = AGENDA[current - 2];
  const isNormal = !!(a && a.type === 'normal');
  const t = textTarget();
  const o = selectedObj();
  setGroup('insert', isNormal || current === 0);
  document.getElementById('rb-insert-text').classList.toggle('disabled', !isNormal);
  setGroup('font', !!t);
  setGroup('para', !!t);
  setGroup('arrange', !!(o && isNormal && sel.sid === a.id));
  setGroup('history', true);
  updateHistoryBtns();

  const toggles = { 'rb-bold': 'bold', 'rb-italic': 'italic', 'rb-underline': 'underline', 'rb-strike': 'strikeThrough',
                    'rb-ul': 'insertUnorderedList', 'rb-ol': 'insertOrderedList',
                    'rb-jl': 'justifyLeft', 'rb-jc': 'justifyCenter', 'rb-jr': 'justifyRight', 'rb-jf': 'justifyFull' };
  const sizeIn = document.getElementById('rb-size');
  if (!t) {
    Object.keys(toggles).forEach(id => document.getElementById(id).classList.remove('on'));
    if (document.activeElement !== sizeIn) sizeIn.value = '';
    return;
  }
  const cs = getComputedStyle(probeElement(t));
  const pt = Math.round(parseFloat(cs.fontSize) / PT * 2) / 2;
  if (document.activeElement !== sizeIn) sizeIn.value = String(pt).replace('.', ',');
  const fam = cs.fontFamily.split(',')[0].replace(/["']/g, '').trim().toLowerCase();
  const f = FONTS.find(x => x.label.toLowerCase() === fam);
  const fontSel = document.getElementById('rb-font');
  if (document.activeElement !== fontSel) fontSel.value = f ? f.css : FONTS[0].css;
  const lh = document.getElementById('rb-lh');
  if (document.activeElement !== lh) {
    const v = String(t.o.lh || 1.25);
    lh.value = [...lh.options].some(op => op.value === v) ? v : '1.25';
  }
  Object.entries(toggles).forEach(([id, cmd]) => {
    let on = false;
    if (t.mode === 'range') { try { on = document.queryCommandState(cmd); } catch (e) {} }
    else {
      if (cmd === 'bold') on = parseInt(cs.fontWeight, 10) >= 600;
      if (cmd === 'italic') on = cs.fontStyle === 'italic';
      if (cmd === 'underline') on = (cs.textDecorationLine || '').includes('underline');
      if (cmd === 'strikeThrough') on = (cs.textDecorationLine || '').includes('line-through');
    }
    document.getElementById(id).classList.toggle('on', !!on);
  });
}

// ══════════════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════════════
function refreshLiveSlides() {
  const slides = document.querySelectorAll('.slide');
  const s = slides[current];

// ══════════════════════════════════════════════════════════════
//  IMAGE STORAGE (IndexedDB — localStorage is far too small for photos)
// ══════════════════════════════════════════════════════════════
let _idb = null;
const IDB_NAME = 'rc_meeting_images', IDB_STORE = 'images';
const _imgCache = {};
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (_idb) return resolve(_idb);
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(imgId, dataURL) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(dataURL, imgId);
    tx.oncomplete = () => { _imgCache[imgId] = dataURL; resolve(); };
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(imgId) {
  if (_imgCache[imgId]) return _imgCache[imgId];
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(imgId);
    req.onsuccess = () => { if (req.result) _imgCache[imgId] = req.result; resolve(req.result || null); };
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(imgId) {
  delete _imgCache[imgId];
  const db = await idbOpen();
  return new Promise(resolve => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(imgId);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}
async function preloadAllImages() {
  await Promise.all(allImageIds().map(id => idbGet(id).catch(() => null)));
}
// Pictures migrated from older versions have no stored aspect ratio yet
async function fixImageAspects() {
  let changed = false;
  for (const a of AGENDA.filter(x => x.type === 'normal')) {
    for (const o of slideObjs(a.id)) {
      if (o.type !== 'image' || o.ar || !_imgCache[o.imgId]) continue;
      const ar = await new Promise(res => {
        const im = new Image();
        im.onload = () => res(im.naturalWidth / im.naturalHeight || 0);
        im.onerror = () => res(0);
        im.src = _imgCache[o.imgId];
      });
      if (!ar) continue;
      o.ar = ar;
      o.h = Math.round(o.w / ar);
      if (o.h > CANVAS_H - 20) { o.h = CANVAS_H - 20; o.w = Math.round(o.h * ar); }
      o.x = clamp(o.x, 0, CANVAS_W - o.w); o.y = clamp(o.y, 0, CANVAS_H - o.h);
      changed = true;
    }
  }
  return changed;
}
// ── Consistent text style across slides ──────────────────────
// The text size/font most used on the other text slides (weighted by amount of text)
function houseTextStyle(excludeSid) {
  const sizes = {}, fams = {};
  AGENDA.filter(a => a.type === 'normal' && a.id !== excludeSid).forEach(a => {
    document.querySelectorAll(`#canvas-${a.id} .tb-content`).forEach(box => {
      const tw = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = tw.nextNode())) {
        const len = n.textContent.replace(/\u200B/g, '').trim().length;
        if (!len) continue;
        const cs = getComputedStyle(n.parentElement);
        sizes[cs.fontSize] = (sizes[cs.fontSize] || 0) + len;
      }
    });
    slideObjs(a.id).forEach(o => { if (o.type === 'text' && o.ff && o.html) fams[o.ff] = (fams[o.ff] || 0) + o.html.length; });
  });
  const top = m => (Object.entries(m).sort((x, y) => y[1] - x[1])[0] || [])[0];
  const fs = parseFloat(top(sizes));
  return { fs: fs > 0 ? Math.round(fs * 100) / 100 : null, ff: top(fams) || null };
}
function hasOwnSizes(o) { return !!o.fs || /font-size/i.test(o.html || ''); }
// Text boxes that still use the default size follow the size of the other slides
// (runs once per slide; afterwards the user's own choice is kept)
function harmonizeTextStyles() {
  data._autoStyle = data._autoStyle || {};
  let changed = false;
  AGENDA.filter(a => a.type === 'normal').forEach(a => {
    const objs = slideObjs(a.id);
    const targets = objs.filter(o => o.type === 'text' && !hasOwnSizes(o) &&
                                     (o.auto || (a.id === 'vorstand' && !data._autoStyle[a.id])));
    if (!targets.length) return;
    const house = houseTextStyle(a.id);
    if (!house.fs) {                                  // nothing to compare with yet
      targets.forEach(o => { if (o.html && o.html.replace(/<[^>]*>/g, '').trim()) { delete o.auto; changed = true; } });
      return;
    }
    targets.forEach(o => {
      if (Math.abs(house.fs - DEFAULT_PT * PT) > 0.5) o.fs = house.fs;
      if (house.ff && !o.ff) o.ff = house.ff;
      delete o.auto;
    });
    data._autoStyle[a.id] = 1;
    renderCanvas(a.id);
    changed = true;
  });
  if (changed) saveData();
}

// Remove picture blobs that no slide references any more (runs once at start-up)
async function gcImages() {
  try {
    const db = await idbOpen();
    const keys = await new Promise((res, rej) => {
      const r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).getAllKeys();
      r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
    });
    const used = new Set(allImageIds());
    for (const k of keys) if (typeof k === 'string' && k.startsWith('img_') && !used.has(k)) await idbDelete(k);
  } catch (e) {}
}

document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const inText = ae && ae.classList && ae.classList.contains('tb-content');
  const inField = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  if (mod && k === 's') { e.preventDefault(); saveDataWithFeedback(); return; }
  if (document.getElementById('import-modal').classList.contains('open')) return;
  if (document.getElementById('pdf-modal').classList.contains('open')) { if (e.key === 'Escape') closeProtocol(); return; }
  if (inField) return;

  if (inText) {
    if (e.key === 'Escape') { e.preventDefault(); ae.blur(); updateRibbon(); return; }
    if (mod && e.shiftKey && (e.key === '>' || e.key === '.')) { e.preventDefault(); growShrink(1); return; }
    if (mod && e.shiftKey && (e.key === '<' || e.key === ',')) { e.preventDefault(); growShrink(-1); return; }
    const s = getSelection();
    const li = s.rangeCount ? listItemAt(s.anchorNode, ae) : null;
    if (li && e.key === 'Tab') {
      e.preventDefault();
      withText(() => document.execCommand(e.shiftKey ? 'outdent' : 'indent', false, null));
      return;
    }
    if (li && e.key === 'Backspace' && !mod && s.isCollapsed) {
      const r = document.createRange(); r.setStart(li, 0); r.setEnd(s.anchorNode, s.anchorOffset);
      if (r.toString() === '' && !r.cloneContents().querySelector('img')) {
        e.preventDefault();
        withText(t => unnumberItem(t.box));
        return;
      }

    return;                                       // everything else: normal typing
  }

  if (editMode) {
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }
    if (sel) {
      const o = selectedObj();
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); arrange('delete'); return; }
      if (e.key === 'Escape') { selectObj(null); return; }
      if (mod && k === 'd') { e.preventDefault(); arrange('duplicate'); return; }
      if (mod && k === 'c') { objClipboard = o ? JSON.parse(JSON.stringify(o)) : null; toast('Objekt kopiert – Strg+V zum Einfügen'); return; }
      if (mod && k === 'b') { e.preventDefault(); fmtToggle('bold'); return; }
      if (mod && k === 'i') { e.preventDefault(); fmtToggle('italic'); return; }
      if (mod && k === 'u') { e.preventDefault(); fmtToggle('underline'); return; }
      const step = e.shiftKey ? 10 : 1;
      const arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
      if (arrows[e.key]) { e.preventDefault(); nudge(...arrows[e.key]); return; }
      if ((e.key === 'Enter' || e.key === 'F2') && o && o.type === 'text') {
        e.preventDefault();
        const box = document.querySelector('#' + o.id + ' .tb-content');
        box.focus();
        const r = document.createRange(); r.selectNodeContents(box); r.collapse(false);

  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || (e.key === ' ' && !editMode)) { e.preventDefault(); navigate(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); navigate(-1); }

// ══════════════════════════════════════════════════════════════
//  PROTOKOLL: all slides → PDF → send by e-mail
//  Each slide is rendered as it appears in the presentation (1 slide = 1 page,
//  16:9). Text boxes with more text than fits get continuation pages, so the
//  protocol always contains the complete text.
// ══════════════════════════════════════════════════════════════
const H2C_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
let _pdfResult = null;            // { blob, file, name, pages }

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[data-src="${src}"]`)?.dataset.ok) return resolve();
    const s = document.createElement('script');
    s.src = src; s.dataset.src = src; s.async = true;
    s.onload = () => { s.dataset.ok = '1'; resolve(); };
    s.onerror = () => { s.remove(); reject(new Error('load')); };
    document.head.appendChild(s);
  });
}
function protocolDateLabel() { return todayLabel(); }
function protocolFileName() {
  const d = new Date();
  return `Protokoll_Clubmeeting_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.pdf`;
}

// ── minimal PDF writer: one JPEG per page (960 × 540 pt = 16:9 like PowerPoint) ──
function pdfTextString(str) {
  let hex = 'FEFF';
  for (const ch of String(str)) {
    const cp = ch.codePointAt(0);
    if (cp > 0xFFFF) { const v = cp - 0x10000; hex += (0xD800 + (v >> 10)).toString(16).padStart(4, '0') + (0xDC00 + (v & 0x3FF)).toString(16).padStart(4, '0'); }
    else hex += cp.toString(16).padStart(4, '0');
  }
  return '<' + hex.toUpperCase() + '>';
}
function buildPdf(pages, title) {
  const enc = new TextEncoder();
  const parts = []; let len = 0; const offs = [];
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
  const W = 960, H = 540, N = pages.length;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Count ${N} /Kids [${pages.map((_, i) => `${4 + 3 * i} 0 R`).join(' ')}] >>`));
  const d = new Date(), pad = v => String(v).padStart(2, '0');
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  obj(3, () => push(`<< /Title ${pdfTextString(title)} /Author ${pdfTextString('Rotary Club Riesa-Elbland')} /Creator ${pdfTextString('Clubmeeting-App')} /CreationDate (D:${stamp}) >>`));
  pages.forEach((p, i) => {
    const n = 4 + 3 * i;
    obj(n, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${n + 2} 0 R >> >> /Contents ${n + 1} 0 R >>`));
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(n + 1, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(n + 2, () => {
      push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);
      push(p.bytes);
      push('\nendstream');
    });
  });
  const size = 4 + 3 * N, xref = len;
  push(`xref\n0 ${size}\n0000000000 65535 f \n`);
  for (let n = 1; n < size; n++) push(String(offs[n]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${size} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

}
function canvasToJpeg(canvas, q = 0.88) {
  return new Promise(resolve => canvas.toBlob(async b => resolve(new Uint8Array(await b.arrayBuffer())), 'image/jpeg', q));
}

// Prepare the off-screen copy html2canvas renders: presentation look, one slide, real list markers
function prepCloneForSlide(doc, idx, origSlide, contLabel) {
  doc.body.classList.remove('edit-mode', 'idle');
  const st = doc.createElement('style');
  st.textContent = `
    #topbar,.nav-btn,#toast,#fs-hint,#progress-bar,#import-modal,#pdf-modal,.rb-pop{display:none!important}
    #stage-wrap{position:static!important;display:block!important;top:0!important;bottom:auto!important}
    #slides{transform:none!important;box-shadow:none!important}

    .title-img-bottom .img-blur{display:none!important}
    .obj,.obj.selected{outline:none!important}

  doc.head.appendChild(st);
  const sl = doc.getElementById('slide-' + idx);
  // inline SVGs are drawn as images: give them their real colour (currentColor would turn black)
  sl.querySelectorAll('svg').forEach(svg => {

  });
  sl.style.cssText += `;display:${getComputedStyle(origSlide).display}!important;opacity:1!important;transform:none!important;`;
  // list numbers/bullets as real text (html2canvas cannot draw attr() pseudo content)
  const origLis = origSlide.querySelectorAll('.tb-content li');
  sl.querySelectorAll('.tb-content li').forEach((li, k) => {
    const o = origLis[k]; if (!o) return;
    const cs = getComputedStyle(o, '::before');

    mk.textContent = o.getAttribute('data-n') || '';
    mk.style.cssText = `display:inline-block;box-sizing:border-box;width:3em;margin-left:-3em;padding-right:.35em;text-align:right;white-space:nowrap;
      font-weight:${cs.fontWeight};font-style:${cs.fontStyle};text-decoration:${cs.textDecorationLine};color:${cs.color};font-size:${cs.fontSize};font-family:${cs.fontFamily}`;
    li.insertBefore(mk, li.firstChild);
  });
  if (contLabel) {
    const pg = sl.querySelector('.slide-footer .pg');
    if (pg) pg.textContent = pg.textContent + ' · ' + contLabel;
  }
}

async function renderProtocolPages(onProgress) {

  document.body.classList.add('capturing');

  finally {
    document.body.classList.remove('capturing');
    if (wasEdit) document.body.classList.add('edit-mode');
    fitStage();
  }
}
async function renderProtocolPagesInner(onProgress) {
  try { await Promise.all([...document.fonts].map(f => f.load().catch(() => {}))); await document.fonts.ready; } catch (e) {}
  const pill = document.querySelector('.title-date-pill'); if (pill) pill.textContent = todayLabel();
  const slides = [...document.querySelectorAll('#slides .slide')];
  const pages = [];
  const scrolled = [];
  for (let i = 0; i < slides.length; i++) {
    const slide = slides[i];
    slide.querySelectorAll('.data-list').forEach(l => { scrolled.push([l, l.scrollTop]); l.scrollTop = 0; });
    const boxes = [...slide.querySelectorAll('.tb-content')];
    boxes.forEach(b => scrolled.push([b, b.scrollTop]));
    // how many pages does the longest text box need?
    let steps = 1;
    const stepOf = b => Math.max(40, b.clientHeight - parseFloat(getComputedStyle(b).fontSize) * 1.3);
    boxes.forEach(b => {
      const over = b.scrollHeight - b.clientHeight;
      if (over > 4) steps = Math.max(steps, 1 + Math.ceil(over / stepOf(b)));
    });
    steps = Math.min(steps, 12);
    for (let k = 0; k < steps; k++) {
      boxes.forEach(b => { b.scrollTop = Math.min(k * stepOf(b), b.scrollHeight - b.clientHeight); });
      onProgress && onProgress(i, slides.length, k, steps);
      const canvas = await window.html2canvas(slide, {
        scale: 1.5, width: STAGE_W, height: STAGE_H, windowWidth: STAGE_W, windowHeight: STAGE_H,
        backgroundColor: '#ffffff', logging: false, useCORS: true, imageTimeout: 15000,
        onclone: doc => prepCloneForSlide(doc, i, slide, k > 0 ? `Fortsetzung ${k + 1}/${steps}` : (steps > 1 ? `Teil 1/${steps}` : '')),
      });
      pages.push({ bytes: await canvasToJpeg(canvas), w: canvas.width, h: canvas.height, thumb: canvas });
    }
  }
  scrolled.forEach(([el, top]) => { el.scrollTop = top; });
  return pages;
}

function pdfModalSet(html) { document.getElementById('pdf-body').innerHTML = html; }
async function openProtocol() {
  blurText(); closePops();
  clearTimeout(_saveT); saveData();
  const modal = document.getElementById('pdf-modal');
  modal.classList.add('open');
  document.getElementById('pdf-foot').style.display = 'none';
  pdfModalSet(`<div class="pdf-progress"><div class="parsing-spinner" id="pdf-status">Protokoll wird erstellt …</div>
    <div class="pdf-bar"><div id="pdf-bar-fill"></div></div></div>`);
  try {
    const pages = await renderProtocolPages((i, n, k, steps) => {
      const st = document.getElementById('pdf-status'), bar = document.getElementById('pdf-bar-fill');
      if (st) st.textContent = `Folie ${i + 1} von ${n}${steps > 1 ? ` (Seite ${k + 1}/${steps})` : ''} wird aufbereitet …`;
      if (bar) bar.style.width = Math.round(((i + (k + 1) / steps) / n) * 100) + '%';
    });
    const title = `Protokoll Clubmeeting – ${protocolDateLabel()}`;
    const blob = buildPdf(pages, title);
    const name = protocolFileName();
    let file = null;
    try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) {}
    _pdfResult = { blob, file, name, pages: pages.length };
    const canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
    const thumbs = document.createElement('div'); thumbs.className = 'pdf-thumbs';
    pages.forEach((p, i) => {
      const c = document.createElement('canvas'); c.width = 192; c.height = 108;
      c.getContext('2d').drawImage(p.thumb, 0, 0, 192, 108);
      c.title = 'Seite ' + (i + 1);
      thumbs.appendChild(c);
    });
    pdfModalSet(`
      <div class="pdf-done">✓ <b>${name}</b> · ${pages.length} Seiten · ${(blob.size / 1048576).toFixed(1).replace('.', ',')} MB</div>
      <div id="pdf-thumb-slot"></div>
      <label class="pdf-field">An (optional)<input type="email" id="pdf-to" placeholder="z. B. vorstand@…" autocomplete="email" value="${escAttr(data.protocolTo || '')}"/></label>
      <div class="pdf-hint">${canShare
        ? '„Per Mail senden“ öffnet das Teilen-Menü – dort <b>Mail</b> wählen, die PDF ist bereits angehängt.'
        : 'Dieser Browser kann Dateien nicht direkt an Mail übergeben: Die PDF wird heruntergeladen und eine neue E-Mail geöffnet – bitte die PDF aus „Downloads“ anhängen.'}</div>`);
    document.getElementById('pdf-thumb-slot').appendChild(thumbs);
    document.getElementById('pdf-share').style.display = canShare ? '' : 'none';
    const mailBtn = document.getElementById('pdf-mail');
    mailBtn.textContent = canShare ? 'E-Mail ohne Anhang' : '✉︎ Herunterladen & E-Mail öffnen';
    mailBtn.className = 'modal-btn ' + (canShare ? 'secondary' : 'primary');
    document.getElementById('pdf-foot').style.display = '';
  } catch (err) {
    pdfModalSet(`<p class="pdf-err">⚠ Das Protokoll konnte nicht erstellt werden.</p>
      <p class="pdf-hint">${err && err.message === 'load'
        ? 'Für die PDF-Erstellung wird einmalig eine Internetverbindung benötigt. Bitte Verbindung prüfen und erneut versuchen.'
        : 'Fehler: ' + escAttr(err && err.message || err)}</p>`);
  }
}
function closeProtocol() { document.getElementById('pdf-modal').classList.remove('open'); }
function protocolMailText() {
  return `Hallo zusammen,\n\nanbei das Protokoll unseres Clubmeetings vom ${protocolDateLabel()}.\n\nViele Grüße\nRotary Club Riesa-Elbland`;
}
function rememberRecipient() {
  const to = (document.getElementById('pdf-to')?.value || '').trim();
  if (to !== (data.protocolTo || '')) { data.protocolTo = to; scheduleSave(); }
  return to;
}
function downloadProtocol() {
  if (!_pdfResult) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(_pdfResult.blob);
  a.download = _pdfResult.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  toast('PDF gespeichert ✓');
}
async function shareProtocol() {
  if (!_pdfResult || !_pdfResult.file) return;
  rememberRecipient();
  try {
    await navigator.share({ files: [_pdfResult.file], title: `Protokoll Clubmeeting – ${protocolDateLabel()}`, text: protocolMailText() });
  } catch (e) {
    if (e && e.name !== 'AbortError') { toast('Teilen nicht möglich – PDF wird heruntergeladen'); downloadProtocol(); }
  }
}
function mailProtocol() {
  if (!_pdfResult) return;
  const to = rememberRecipient();
  const canShare = !!(_pdfResult.file && navigator.canShare && navigator.canShare({ files: [_pdfResult.file] }));
  if (!canShare) downloadProtocol();
  const subject = `Protokoll Clubmeeting – ${protocolDateLabel()}`;
  const body = protocolMailText() + (canShare ? '' : `\n\n(Anhang: ${_pdfResult.name})`);
  setTimeout(() => {
    location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }, canShare ? 0 : 400);
}

// ══════════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════════
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen();
}
let _t;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_t); _t = setTimeout(() => el.classList.remove('show'), 2600);
}
// Presentation mode: hide controls after a few seconds without mouse movement
let _idleT;
function poke() {
  document.body.classList.remove('idle');
  clearTimeout(_idleT);
  _idleT = setTimeout(() => {
    if (!editMode && !document.querySelector('#import-modal.open, #pdf-modal.open')) document.body.classList.add('idle');
  }, 2600);
}
['pointermove', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, poke, { passive: true }));

// ── STAGE SCALING (fit the 1280×720 stage into the window) ────
function fitStage() {
  const stage = document.getElementById('slides');
  const wrap = document.getElementById('stage-wrap');
  if (!stage || !wrap) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  let top = 0, side = 0, bottom = 0;
  if (editMode) {
    top = document.getElementById('topbar').offsetHeight + 14;
    side = vw > 900 ? 74 : 8;
    bottom = 14;
  }
  wrap.style.top = top + 'px';
  wrap.style.bottom = bottom + 'px';
  stageScale = Math.max(0.1, Math.min((vw - 2 * side) / STAGE_W, (vh - top - bottom) / STAGE_H));
  stage.style.transform = `scale(${stageScale})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', () => setTimeout(fitStage, 120));
document.addEventListener('fullscreenchange', () => setTimeout(fitStage, 120));
if (window.ResizeObserver) new ResizeObserver(() => fitStage()).observe(document.getElementById('topbar'));

document.getElementById('slides').addEventListener('pointerdown', onStagePointerDown);
document.addEventListener('pointermove', onPointerMove);
document.addEventListener('pointerup', onPointerUp);
document.addEventListener('pointercancel', onPointerUp);
document.addEventListener('pointerdown', e => {
  // click outside the slide (grey workspace) → deselect, like PowerPoint
  if (!editMode || !sel) return;
  if (e.target.closest('#slides, #topbar, .rb-pop, #import-modal, #pdf-modal, .nav-btn')) return;
  blurText(); selectObj(null);
});

loadData();
buildSlides();

(async () => {

    const changed = await fixImageAspects();
    AGENDA.filter(a => a.type === 'normal').forEach(a => renderCanvas(a.id));
    if (changed) saveData();
    harmonizeTextStyles();
    gcImages();
