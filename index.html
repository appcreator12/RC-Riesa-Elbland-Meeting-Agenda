:root {
  --blue:   #003F87;
  --blue2:  #0050AC;
  --navy:   #0B2B5B;
  --sky:    #6FA8DC;
  --gold:   #F7A81B;
  --gold2:  #FFC94A;
  --white:  #FFFFFF;
  --bg:     #F3F6FB;
  --offwht: #F0F5FF;
  --light:  #E8EFF8;
  --line:   #E2E9F3;
  --muted:  #7A8BA8;
  --text:   #1A2B4A;
  --sel:    #2F6FED;
  --shadow: 0 2px 6px rgba(16,42,90,.06), 0 14px 34px rgba(16,42,90,.10);
  --r: 14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #0a1020;
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
body.edit-mode { background: #DDE3EC; }

/* ══════════════════════════════════════════
   FIXED 16:9 STAGE — 1280 × 720 px
   Everything inside uses fixed px (no vw/vh), and the stage is scaled as a
   whole. 1280×720 equals a PowerPoint 16:9 slide at 96 dpi, so 1 pt = 1.333 px
   and a 24 pt text here looks exactly like 24 pt in PowerPoint.
══════════════════════════════════════════ */
#stage-wrap {
  position: fixed; left: 0; right: 0; bottom: 0; top: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#slides {
  width: 1280px; height: 720px;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  transform-origin: center center;
  background: var(--bg);
  box-shadow: 0 10px 60px rgba(0,0,0,.45);
}
body.edit-mode #slides { box-shadow: 0 4px 30px rgba(16,42,90,.22); }

.slide {
  position: absolute; inset: 0;
  opacity: 0; pointer-events: none;
  transition: opacity .45s cubic-bezier(.4,0,.2,1), transform .45s cubic-bezier(.4,0,.2,1);
  transform: translateX(60px);
  overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: all; transform: translateX(0); }
.slide.prev   { opacity: 0; transform: translateX(-60px); }

/* ── PROGRESS BAR ────────────────────────── */
#progress-bar {
  position: fixed; top: 0; left: 0; height: 3px;
  background: var(--gold);
  transition: width .4s ease;
  z-index: 160;
  box-shadow: 0 0 8px var(--gold);
}
body.edit-mode #progress-bar { display: none; }

/* ── NAV ARROWS ──────────────────────────── */
.nav-btn {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 46px; height: 46px;
  background: rgba(11,43,91,.45);
  border: 1px solid rgba(255,255,255,.28);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 120; color: #fff;
  transition: background .2s, opacity .3s;
  opacity: .75;
}
.nav-btn:hover { background: rgba(11,43,91,.7); opacity: 1; }
.nav-btn svg { width: 20px; height: 20px; }
.nav-btn svg path { stroke: currentColor; }
#btn-prev { left: 14px; }
#btn-next { right: 14px; }
#btn-prev.hidden, #btn-next.hidden { opacity: 0 !important; pointer-events: none; }
body.edit-mode .nav-btn { background: #fff; border-color: #CFD8E6; color: #24324A; opacity: 1; box-shadow: 0 2px 8px rgba(16,42,90,.12); }
body.edit-mode .nav-btn:hover { background: #EEF3FB; }

/* ── TOP BAR (app buttons + PowerPoint-style ribbon) ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 150;
  display: flex; align-items: flex-start; justify-content: flex-end; gap: 8px;
  padding: 14px 16px;
  pointer-events: none;
  transition: opacity .3s;
}
#topbar > * { pointer-events: auto; }
body.edit-mode #topbar {
  background: #fff; border-bottom: 1px solid #D5DEEB;
  box-shadow: 0 2px 12px rgba(16,42,90,.08);
  padding: 7px 10px; align-items: center; justify-content: space-between;
}
#appbar { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
.tb-btn {
  height: 36px; padding: 0 14px;
  border-radius: 18px;
  border: 1.5px solid rgba(255,255,255,.25);
  background: rgba(0,0,0,.25);
  backdrop-filter: blur(10px);
  color: rgba(255,255,255,.88);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: background .2s, border-color .2s;
  white-space: nowrap;
}
.tb-btn:hover { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.5); }
.tb-btn svg { width: 15px; height: 15px; }
body.edit-mode .tb-btn {
  background: #fff; border: 1px solid #D5DEEB; color: #24324A; backdrop-filter: none;
  height: 34px; border-radius: 9px; padding: 0 10px;
}
body.edit-mode .tb-btn:hover { background: #EEF3FB; }
body.edit-mode #btn-edit { background: var(--gold); border-color: var(--gold); color: var(--blue); padding: 0 14px; }
body.edit-mode #btn-edit:hover { background: var(--gold2); }
body.edit-mode .tb-btn .tb-label-opt { display: none; }

#ribbon { display: none; flex-wrap: wrap; align-items: center; row-gap: 4px; flex: 1; min-width: 0; }
body.edit-mode #ribbon { display: flex; }
.rb-group {
  display: flex; align-items: center; gap: 2px;
  padding: 0 8px; border-right: 1px solid #E3E9F2;
  transition: opacity .15s;
}
.rb-group:last-child { border-right: none; }
.rb-group.disabled { opacity: .35; pointer-events: none; }
.rb-btn {
  height: 34px; min-width: 34px; padding: 0 7px;
  border: 1px solid transparent; border-radius: 8px;
  background: transparent; color: #24324A;
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; position: relative;
}
.rb-btn:hover { background: #EEF3FB; }
.rb-btn.on { background: #DCE7FA; border-color: #B9CCF2; color: #0B3A8C; }
.rb-btn.disabled { opacity: .35; pointer-events: none; }
.rb-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.rb-btn.big { background: #F1F5FB; font-size: 13px; padding: 0 11px; }
.rb-btn.big:hover { background: #E3ECF9; }
.rb-btn .lbl { font-size: 13px; font-weight: 600; }
.rb-btn .grow { font-size: 16px; } .rb-btn .grow sup, .rb-btn .grow sub { font-size: 9px; }
.rb-btn.color { flex-direction: column; gap: 1px; padding-top: 3px; }
.rb-btn.color .bar { width: 20px; height: 4px; border-radius: 2px; background: #C0392B; }
.rb-btn.color .chev { position: absolute; right: 2px; bottom: 2px; font-size: 8px; opacity: .6; }
.rb-select, .rb-input {
  height: 34px; border: 1px solid #D5DEEB; border-radius: 8px;
  background: #fff; color: #24324A;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  padding: 0 8px; outline: none;
}
.rb-select:focus, .rb-input:focus { border-color: var(--sel); }
.rb-select.font { width: 168px; }
.rb-select.lh { width: 74px; }
.rb-input.size { width: 58px; text-align: center; }
.rb-status { font-size: 12px; color: #7A8BA8; padding: 0 10px; white-space: nowrap; }

/* Colour pop-overs */
.rb-pop {
  position: fixed; z-index: 400; display: none;
  background: #fff; border: 1px solid #D5DEEB; border-radius: 12px;
  box-shadow: 0 14px 36px rgba(16,42,90,.2);
  padding: 12px;
}
.rb-pop.open { display: block; }
.rb-pop .pop-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #7A8BA8; margin-bottom: 8px; }
.sw-grid { display: grid; grid-template-columns: repeat(5, 28px); gap: 7px; }
.sw { width: 28px; height: 28px; border-radius: 7px; border: 1px solid rgba(0,0,0,.14); cursor: pointer; }
.sw:hover { transform: scale(1.1); }
.sw.none { background: linear-gradient(135deg, #fff 45%, #C0392B 45%, #C0392B 55%, #fff 55%); }
.pop-more {
  margin-top: 10px; width: 100%; height: 30px; border-radius: 8px;
  border: 1px solid #D5DEEB; background: #F7F9FC; color: #24324A;
  font: 600 12px 'DM Sans', sans-serif; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; overflow: hidden;
}
.pop-more input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.rb-btn.split { min-width: 16px; width: 16px; padding: 0; margin-left: -3px; }
.rb-btn.split svg { width: 12px; height: 12px; }
#pop-number { width: 310px; }
.num-fmt { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.nf {
  height: 30px; padding: 0 10px; border-radius: 8px;
  border: 1px solid #D5DEEB; background: #F7F9FC; color: #24324A;
  font: 600 13px 'DM Sans', sans-serif; cursor: pointer;
}
.nf:hover { background: #E3ECF9; }
.nf.on { background: #DCE7FA; border-color: #9DB7EC; color: #0B3A8C; }
.nf.wide { width: 100%; height: auto; min-height: 30px; padding: 6px 10px; text-align: left; margin-top: 6px; line-height: 1.3; }
.nf.danger { color: #B03A2E; }
.num-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 13px; font-weight: 600; color: #24324A; margin: 6px 0;
}
.num-row input {
  width: 72px; height: 30px; border: 1px solid #D5DEEB; border-radius: 8px;
  font: 600 14px 'DM Sans', sans-serif; text-align: center; color: #24324A; outline: none;
}
.num-row input:focus { border-color: var(--sel); }
.num-row input:disabled { background: #F1F4F8; color: #A3B1C9; }
.num-actions { margin-top: 6px; border-top: 1px solid #E3E9F2; padding-top: 4px; }
.num-hint { margin-top: 10px; font-size: 11px; line-height: 1.4; color: #7A8BA8; }

/* ══════════════════════════════════════════
   SHARED SLIDE PARTS (header, footer, watermark)
══════════════════════════════════════════ */
.hdr {
  position: absolute; left: 0; top: 0; width: 1280px; height: 104px;
  background: #fff;
  display: flex; align-items: center; gap: 22px;
  padding: 0 48px;
  border-bottom: 4px solid var(--gold);
  z-index: 4;
}
.hdr-num {
  width: 60px; height: 60px; border-radius: 16px; flex-shrink: 0;
  background: var(--blue); color: var(--gold);
  font-size: 28px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px rgba(0,63,135,.25);
}
.hdr-text { flex: 1; min-width: 0; }
.hdr-title {
  font-family: 'DM Serif Display', serif; font-size: 40px; line-height: 1.05;
  color: var(--blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-sub {
  font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin-top: 6px;
}
.hdr-actions { display: none; gap: 8px; }
body.edit-mode .hdr-actions { display: flex; }
.hdr-logo img { height: 64px; width: auto; display: block; }

.slide-footer {
  position: absolute; left: 0; right: 0; bottom: 0; height: 36px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px;
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted);
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,.75);
  z-index: 3;
}
.slide-footer .pg { letter-spacing: .06em; font-variant-numeric: tabular-nums; }

.slide-watermark {
  position: absolute; right: -90px; bottom: -130px; width: 560px; height: 560px;
  color: var(--blue); opacity: .045; pointer-events: none; z-index: 0;
}

/* ══════════════════════════════════════════
   SLIDE 1 – TITLE  (top: text | bottom: photo)
══════════════════════════════════════════ */
#slide-0 { background: var(--blue); display: flex; flex-direction: column; }
.title-top {
  flex: 0 0 292px;
  background: linear-gradient(135deg, #003F87 0%, #0B2B5B 100%);
  display: flex; flex-direction: column; justify-content: center;
  padding: 30px 64px;
  position: relative; overflow: hidden;
}
.bg-wheel {
  position: absolute; right: -70px; top: 50%; transform: translateY(-50%);
  width: 440px; opacity: .06; pointer-events: none; z-index: 0;
}
.title-top-bar {
  position: absolute; top: 28px; right: 44px; z-index: 10;
  background: rgba(255,255,255,.96);
  border-radius: 18px; padding: 12px 22px;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}
.title-top-bar img { height: 92px; width: auto; display: block; }
.title-content { position: relative; z-index: 2; display: flex; flex-direction: column; }
.title-accent-line { width: 52px; height: 4px; background: var(--gold); border-radius: 2px; margin-bottom: 14px; }
.title-eyebrow { font-size: 15px; font-weight: 600; letter-spacing: .26em; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; }
.title-main {
  font-family: 'DM Serif Display', serif; font-size: 92px; line-height: .95;
  color: #fff; margin-bottom: 20px; text-shadow: 0 2px 20px rgba(0,0,0,.25);
}
.title-date-row { display: flex; align-items: center; gap: 20px; }
.title-date-pill {
  background: var(--gold); color: var(--blue);
  font-size: 19px; font-weight: 700; letter-spacing: .03em;
  padding: 8px 20px; border-radius: 22px; white-space: nowrap;
}
.title-slogan { font-size: 19px; font-style: italic; color: rgba(255,255,255,.72); }
.title-divider-bar { height: 4px; flex-shrink: 0; background: var(--gold); }
.title-img-bottom { flex: 1; position: relative; background: #0a1a3a; overflow: hidden; }
.title-img-bottom .img-blur {
  position: absolute; inset: -50px;
  background-size: cover; background-position: center;
  filter: blur(30px) brightness(.55) saturate(1.1);
}
.title-img-bottom .img-fill {
  position: absolute; inset: 0;
  background-size: contain; background-position: center; background-repeat: no-repeat;
}
.title-img-bottom .img-placeholder {
  position: absolute; inset: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; color: rgba(255,255,255,.55);
  font-size: 17px; letter-spacing: .04em;
  border: 2px dashed rgba(255,255,255,.18); border-radius: 12px;
}
body.edit-mode .title-img-bottom .img-placeholder { border-color: rgba(247,168,27,.6); color: rgba(255,255,255,.85); }
.title-img-bottom .img-placeholder svg { width: 52px; height: 52px; opacity: .6; }
#title-upload-zone {
  position: absolute; inset: 0; z-index: 20;
  display: none; align-items: center; justify-content: center;
  cursor: pointer; background: rgba(0,20,60,.2); transition: background .2s;
}
body.edit-mode #title-upload-zone { display: flex; }
#title-upload-zone:hover, #title-upload-zone.drag { background: rgba(0,20,60,.5); }
#title-upload-zone:hover .img-change-badge, #title-upload-zone.drag .img-change-badge { opacity: 1; transform: scale(1.03); }
.img-change-badge {
  background: rgba(0,0,0,.6); backdrop-filter: blur(12px);
  border: 2px solid rgba(255,255,255,.3); border-radius: 16px;
  padding: 16px 26px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: #fff; font-size: 15px; font-weight: 600;
  opacity: 0; transform: scale(.96); transition: opacity .25s, transform .25s;
  pointer-events: none;
}
.img-change-badge svg { width: 30px; height: 30px; opacity: .85; }

/* ══════════════════════════════════════════
   SLIDE 2 – AGENDA OVERVIEW
══════════════════════════════════════════ */
.agenda-wrap {
  position: absolute; top: 104px; left: 0; right: 0; bottom: 36px;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
  gap: 22px 24px; padding: 30px 48px;
  z-index: 2;
}
.ag-card {
  min-width: 0; min-height: 0;
  background: #fff; border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 26px 28px 22px;
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto 1fr; column-gap: 18px;
  position: relative; overflow: hidden; cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}
.ag-card::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 6px; background: var(--gold); }
.ag-card:hover { transform: translateY(-4px); box-shadow: 0 4px 10px rgba(16,42,90,.08), 0 22px 44px rgba(16,42,90,.14); }
.ag-num { font-family: 'DM Serif Display', serif; font-size: 58px; line-height: 1; color: var(--blue); grid-column: 1; grid-row: 1; }
.ag-icon {
  width: 54px; height: 54px; border-radius: 15px; margin: 2px 0 0; grid-column: 2; grid-row: 1; justify-self: end;
  background: #EEF3FB; color: var(--blue);
  display: flex; align-items: center; justify-content: center;
}
.ag-icon svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ag-title { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1.2; overflow-wrap: break-word; grid-column: 1 / -1; grid-row: 2; margin-top: 18px; }
.ag-sub { font-size: 16px; color: var(--muted); line-height: 1.4; grid-column: 1 / -1; grid-row: 3; align-self: end; }

/* ══════════════════════════════════════════
   CONTENT SLIDES – free canvas with objects
══════════════════════════════════════════ */
.canvas {
  position: absolute; left: 0; top: 104px; width: 1280px; height: 580px;
  z-index: 5;
}
body.edit-mode .canvas {
  background-image: radial-gradient(rgba(0,63,135,.13) 1px, transparent 1.2px);
  background-size: 32px 32px; background-position: 16px 16px;
}
.obj { position: absolute; }
.obj-text { padding: 12px 16px; }
.tb-content {
  width: 100%; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  outline: none;
  font-family: 'DM Sans', sans-serif; font-size: 32px; line-height: 1.25;
  color: var(--text);
  overflow-wrap: break-word;
  position: relative;
  user-select: text; -webkit-user-select: text;
}
.tb-content::-webkit-scrollbar { width: 6px; }
.tb-content::-webkit-scrollbar-thumb { background: rgba(0,63,135,.18); border-radius: 3px; }
.tb-content p, .tb-content div { margin: 0; }
.tb-content ul, .tb-content ol { margin: .15em 0 .15em .2em; padding-left: 1.2em; }
.tb-content ol { padding-left: 1.7em; }
/* Own list markers instead of the browser's: they take over the formatting of the
   first character of the line (bold, italic, underline, colour, size, font) — like PowerPoint */
.tb-content li { margin: .1em 0; list-style: none; }
.tb-content li::before {
  content: attr(data-n);
  display: inline-block; box-sizing: border-box;
  width: 3em; margin-left: -3em; padding-right: .35em; text-align: right;   /* sits on the same baseline as the text */
  white-space: nowrap; pointer-events: none;
  font-weight: var(--mk-w, inherit); font-style: var(--mk-i, inherit);
  text-decoration: var(--mk-d, none); color: var(--mk-c, inherit);
  font-size: var(--mk-s, inherit); font-family: var(--mk-f, inherit);
}
.tb-content ul > li::before { color: var(--mk-c, var(--gold)); }
.tb-content ol ol { list-style-type: lower-alpha; }
.tb-content ol ol ol { list-style-type: lower-roman; }
.tb-content ul ul { list-style-type: circle; }
.tb-content blockquote { margin: 0 0 0 1.4em; }
.tb-content a { color: var(--blue2); }
body.edit-mode .tb-content { cursor: text; }
body.edit-mode .tb-content.is-empty::before {
  content: attr(data-ph); position: absolute; left: 0; top: 0;
  color: #A3B1C9; pointer-events: none;
}
body.edit-mode .obj-text { outline: 1px dashed rgba(0,63,135,.30); cursor: move; }
body.edit-mode .obj-img  { cursor: move; }
body.edit-mode .obj:hover { outline: 1px solid rgba(47,111,237,.65); }
body.edit-mode .obj.selected { outline: 1.5px solid var(--sel); }
.obj-img { border-radius: 8px; box-shadow: 0 10px 26px rgba(16,42,90,.18); }
.obj-img img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  border-radius: 8px; pointer-events: none; -webkit-user-drag: none;
}
.obj-img.plain { box-shadow: none; border-radius: 0; }
.obj-img.plain img { object-fit: contain; border-radius: 0; }
body.edit-mode .obj-img, body.edit-mode .obj-text, .tb-grip, .hdl { touch-action: none; }
body.edit-mode .tb-content { touch-action: auto; }
.obj.dragging { opacity: .9; }
.hdl {
  display: none; position: absolute; z-index: 3;
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: 1.5px solid var(--sel);
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  touch-action: none;
}
.hdl::after { content: ''; position: absolute; inset: -9px; }
body.edit-mode .obj.selected .hdl { display: block; }
.hdl-nw { left: -7px; top: -7px; cursor: nwse-resize; }
.hdl-n  { left: calc(50% - 7px); top: -7px; cursor: ns-resize; }
.hdl-ne { right: -7px; top: -7px; cursor: nesw-resize; }
.hdl-e  { right: -7px; top: calc(50% - 7px); cursor: ew-resize; }
.hdl-se { right: -7px; bottom: -7px; cursor: nwse-resize; }
.hdl-s  { left: calc(50% - 7px); bottom: -7px; cursor: ns-resize; }
.hdl-sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
.hdl-w  { left: -7px; top: calc(50% - 7px); cursor: ew-resize; }
.tb-grip {
  display: none; position: absolute; z-index: 4;
  top: -34px; left: 50%; transform: translateX(-50%);
  height: 26px; padding: 0 12px; border-radius: 13px;
  background: var(--sel); color: #fff;
  font-size: 13px; font-weight: 600; white-space: nowrap;
  align-items: center; gap: 6px; cursor: move; touch-action: none;
  box-shadow: 0 3px 10px rgba(47,111,237,.35);
}
.obj.grip-below .tb-grip { top: auto; bottom: -34px; }
body.edit-mode .obj.selected .tb-grip { display: flex; }
.guide { position: absolute; display: none; pointer-events: none; z-index: 9999; }
.guide.gv { top: 0; bottom: 0; width: 0; border-left: 1px dashed #E0457B; }
.guide.gh { left: 0; right: 0; height: 0; border-top: 1px dashed #E0457B; }
.canvas.drop-target { box-shadow: inset 0 0 0 3px var(--gold); }

/* ══════════════════════════════════════════
   DATA SLIDES (Geburtstage + Termine)
══════════════════════════════════════════ */
.data-area {
  position: absolute; top: 128px; left: 48px; right: 48px; bottom: 56px;
  background: #fff; border-radius: 18px; box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column; z-index: 2;
}
.data-list {
  flex: 1; overflow-y: auto;
  padding: 14px 26px 22px;
  display: flex; flex-direction: column; gap: 8px;
  position: relative;
}
.data-list::-webkit-scrollbar { width: 6px; }
.data-list::-webkit-scrollbar-thumb { background: var(--light); border-radius: 3px; }
.data-section-label {
  font-size: 13px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
  padding: 10px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 2px;
}
.bday-item {
  display: flex; align-items: center; gap: 18px;
  padding: 10px 16px; border-radius: 12px;
  border: 1px solid transparent;
}
.bday-item.this-month { background: #FFFBF0; border-color: rgba(247,168,27,.35); }
.bday-item.today { background: #FFF3D0; border-color: var(--gold); }
.bday-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--blue); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 600; flex-shrink: 0;
}
.bday-photo { object-fit: cover; border: 2px solid var(--light); }
.bday-item.this-month .bday-avatar { background: var(--gold); color: var(--blue); }
.bday-item.today .bday-avatar { background: #E67E22; color: #fff; }
.bday-name { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1.2; }
.bday-date { font-size: 18px; color: var(--muted); margin-top: 2px; }
.bday-badge {
  margin-left: auto; font-size: 17px; font-weight: 700;
  padding: 6px 14px; border-radius: 12px;
  background: var(--gold); color: var(--blue); flex-shrink: 0;
}
.bday-soon {
  font-size: 16px; font-weight: 600; color: var(--blue);
  background: var(--offwht); border: 1px solid var(--light);
  padding: 4px 12px; border-radius: 12px; flex-shrink: 0; white-space: nowrap;
}
.bday-past-label { font-size: 16px; color: var(--muted); flex-shrink: 0; white-space: nowrap; }
.bday-past { opacity: .6; }
.event-item {
  display: flex; gap: 20px; align-items: flex-start;
  padding: 10px 16px; border-radius: 12px;
  border: 1px solid transparent;
}
.event-item.upcoming { border-color: rgba(0,63,135,.14); background: #F0F5FF; }
.event-date-block {
  flex-shrink: 0; width: 76px; text-align: center;
  background: var(--blue); color: #fff;
  border-radius: 12px; padding: 7px 4px;
}
.event-date-block .eday { font-size: 32px; font-weight: 700; line-height: 1; }
.event-date-block .emon { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; opacity: .9; margin-top: 3px; }
.event-item.upcoming .event-date-block { background: var(--gold); color: var(--blue); }
.event-item[style*="opacity:.45"] .event-date-block { background: var(--muted); }
.event-info { flex: 1; min-width: 0; }
.event-title { font-size: 25px; font-weight: 600; color: var(--text); line-height: 1.25; }
.event-meta { font-size: 17px; color: var(--muted); margin-top: 4px; }
.event-thema { font-size: 17px; color: var(--blue); margin-top: 3px; font-weight: 500; }
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--muted); gap: 10px; padding: 24px;
}
.empty-state svg { width: 52px; height: 52px; opacity: .35; }
.empty-state p { font-size: 20px; text-align: center; line-height: 1.5; }
.empty-state .hint { font-size: 16px; opacity: .8; }
.data-watermark { position: absolute; right: -3%; bottom: -6%; width: 38%; opacity: .04; pointer-events: none; }

.csv-import-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--blue); color: #fff;
  border: none; border-radius: 10px;
  padding: 9px 14px; font-size: 14px;
  font-family: 'DM Sans', sans-serif; font-weight: 600;
  cursor: pointer; transition: background .2s; flex-shrink: 0;
}
.csv-import-btn:hover { background: var(--blue2); }
.csv-import-btn svg { width: 15px; height: 15px; }

/* ── NOTIFICATIONS / HINTS ───────────────── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--text); color: #fff;
  padding: 11px 22px; border-radius: 22px;
  font-size: 13px; font-weight: 500;
  z-index: 500; transition: transform .3s ease;
  white-space: nowrap; pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
#toast.show { transform: translateX(-50%) translateY(0); }
#fs-hint {
  position: fixed; bottom: 16px; left: 22px;
  font-size: 11px; color: rgba(255,255,255,.35);
  z-index: 50; letter-spacing: .04em; transition: opacity .3s;
}
body.edit-mode #fs-hint { display: none; }

/* Presentation mode: controls fade out when the mouse rests */
body.idle:not(.edit-mode) #topbar,
body.idle:not(.edit-mode) .nav-btn,
body.idle:not(.edit-mode) #fs-hint { opacity: 0 !important; pointer-events: none; }
body.idle:not(.edit-mode) { cursor: none; }

/* ── PDF IMPORT MODAL ────────────────────── */
#pdf-modal {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,10,30,.72); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
#pdf-modal.open { display: flex; }
body.capturing .tb-content li::before { content: none !important; }
body.capturing .title-img-bottom .img-blur { display: none !important; }
.pdf-progress { padding: 10px 0 6px; }
.pdf-bar { height: 6px; background: var(--light); border-radius: 3px; overflow: hidden; }
#pdf-bar-fill { height: 100%; width: 0; background: var(--gold); transition: width .3s; }
.pdf-done { font-size: 14px; color: var(--text); }
.pdf-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; max-height: 260px; overflow-y: auto; padding: 2px; }
.pdf-thumbs canvas { width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--light); box-shadow: 0 2px 6px rgba(16,42,90,.08); }
.pdf-field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
.pdf-field input { height: 36px; border: 1px solid #D5DEEB; border-radius: 8px; padding: 0 10px; font: 500 14px 'DM Sans', sans-serif; color: var(--text); outline: none; }
.pdf-field input:focus { border-color: var(--gold); }
.pdf-hint { font-size: 12px; line-height: 1.5; color: var(--muted); }
.pdf-err { font-size: 14px; color: #c0392b; font-weight: 600; }

#import-modal {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,10,30,.72);
  backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
#import-modal.open { display: flex; }
.modal-box {
  background: white; border-radius: 16px;
  width: min(680px, 100%); max-height: 85vh;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 60px rgba(0,0,0,.35);
  overflow: hidden;
}
.modal-head {
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--light);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.modal-head h2 {
  font-size: 16px; font-weight: 600; color: var(--text);
}
.modal-close {
  width: 30px; height: 30px; border-radius: 50%;
  border: none; background: var(--light);
  cursor: pointer; font-size: 16px; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: #d0d7e8; }
.modal-body {
  flex: 1; overflow-y: auto; padding: 16px 24px;
  display: flex; flex-direction: column; gap: 12px;
}
.modal-section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 4px;
}
.raw-text-box {
  background: var(--offwht); border: 1px solid var(--light);
  border-radius: 8px; padding: 10px 12px;
  font-size: 11px; font-family: monospace;
  color: var(--text); white-space: pre-wrap;
  max-height: 130px; overflow-y: auto; line-height: 1.5;
}
.parsed-list {
  display: flex; flex-direction: column; gap: 4px;
  max-height: 240px; overflow-y: auto;
}
.parsed-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; border-radius: 6px;
  background: var(--offwht); font-size: 12px;
}
.parsed-item input[type=checkbox] { accent-color: var(--blue); flex-shrink: 0; }
.parsed-item .pi-name { flex: 1; font-weight: 500; color: var(--text); }
.parsed-item .pi-date { color: var(--muted); font-size: 11px; }
.parsed-item.unchecked { opacity: .45; }
.manual-entry-area {
  border: 1.5px dashed var(--light); border-radius: 8px;
  padding: 10px 12px; font-size: 12px;
  font-family: 'DM Sans', sans-serif; color: var(--text);
  resize: vertical; min-height: 80px; outline: none;
  transition: border-color .2s;
}
.manual-entry-area:focus { border-color: var(--gold); }
.modal-foot {
  padding: 12px 24px; border-top: 1px solid var(--light);
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-shrink: 0;
}
.modal-count { font-size: 12px; color: var(--muted); }
.modal-btn {
  padding: 8px 20px; border-radius: 8px; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  font-weight: 500; cursor: pointer; transition: background .2s;
}
.modal-btn.primary { background: var(--blue); color: white; }
.modal-btn.primary:hover { background: var(--blue2); }
.modal-btn.secondary { background: var(--light); color: var(--text); }
.modal-btn.secondary:hover { background: #d0d7e8; }
.modal-btn.danger { background: #fdecea; color: #c0392b; }
.modal-btn.danger:hover { background: #f5c6c6; }

/* Event edit table */
.event-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.event-table th {
  text-align: left; padding: 6px 8px;
  font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 2px solid var(--light); background: var(--offwht);
}
.event-table th:first-child { width: 32px; }
.event-table th.col-date  { width: 110px; }
.event-table th.col-time  { width: 76px; }
.event-table th.col-del   { width: 32px; }
.event-table td {
  padding: 4px 4px; border-bottom: 1px solid var(--light);
  vertical-align: middle;
}
.event-table tr:hover td { background: #fafbff; }
.et-input {
  width: 100%; border: 1px solid transparent; border-radius: 5px;
  padding: 4px 6px; font-size: 12px; font-family: 'DM Sans',sans-serif;
  color: var(--text); background: transparent; outline: none;
  transition: border-color .15s, background .15s;
}
.et-input:focus { border-color: var(--gold); background: #FFFBF0; }
.et-del {
  background: none; border: none; cursor: pointer;
  color: #ccc; font-size: 15px; padding: 2px 4px;
  border-radius: 4px; line-height: 1;
}
.et-del:hover { color: #c0392b; background: #fdecea; }
.add-row-btn {
  background: none; border: 1px dashed var(--light);
  border-radius: 6px; padding: 6px 12px;
  font-size: 11px; color: var(--muted); cursor: pointer;
  width: 100%; text-align: center; margin-top: 6px;
  font-family: 'DM Sans',sans-serif;
  transition: border-color .15s, color .15s;
}
.add-row-btn:hover { border-color: var(--gold); color: var(--blue); }


.parsing-spinner {
  display: flex; align-items: center; gap: 8px;
  color: var(--muted); font-size: 12px; padding: 20px 0;
}
.parsing-spinner::before {
  content: ''; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--light); border-top-color: var(--blue);
  animation: spin .7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="progress-bar"></div>

<!-- ═══ TOP BAR: ribbon (edit mode) + app buttons ═══ -->
<div id="topbar">
  <div id="ribbon">
    <div class="rb-group" data-group="insert">
      <button class="rb-btn big" data-cmd="insertImage" title="Bild einfügen (auch per Drag &amp; Drop oder Strg+V)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span class="lbl">Bild</span>
      </button>
      <button class="rb-btn big" data-cmd="insertText" id="rb-insert-text" title="Textfeld einfügen">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M12 9v7"/></svg><span class="lbl">Textfeld</span>
      </button>
    </div>
    <div class="rb-group" data-group="font">
      <select class="rb-select font" id="rb-font" title="Schriftart"></select>
      <input class="rb-input size" id="rb-size" list="rb-sizes" title="Schriftgrad (pt)" inputmode="decimal" autocomplete="off"/>
      <datalist id="rb-sizes"></datalist>
      <button class="rb-btn" data-cmd="grow" title="Schriftgrad vergrößern (Strg+Umschalt+&gt;)"><span class="grow">A<sup>▲</sup></span></button>
      <button class="rb-btn" data-cmd="shrink" title="Schriftgrad verkleinern (Strg+Umschalt+&lt;)"><span class="grow">A<sub>▼</sub></span></button>
      <button class="rb-btn" data-cmd="bold" id="rb-bold" title="Fett (Strg+B)"><b>F</b></button>
      <button class="rb-btn" data-cmd="italic" id="rb-italic" title="Kursiv (Strg+I)"><i style="font-family:Georgia,serif">K</i></button>
      <button class="rb-btn" data-cmd="underline" id="rb-underline" title="Unterstrichen (Strg+U)"><u>U</u></button>
      <button class="rb-btn" data-cmd="strikeThrough" id="rb-strike" title="Durchgestrichen"><s>ab</s></button>
      <button class="rb-btn color" data-cmd="popColor" id="rb-color" title="Schriftfarbe"><span style="font-size:16px;line-height:1">A</span><span class="bar" id="rb-color-bar"></span><span class="chev">▼</span></button>
      <button class="rb-btn color" data-cmd="popHilite" id="rb-hilite" title="Texthervorhebungsfarbe">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"/></svg><span class="bar" id="rb-hilite-bar" style="background:#FFF176"></span><span class="chev">▼</span>
      </button>
      <button class="rb-btn" data-cmd="clearFormat" title="Alle Formatierungen löschen">
        <svg viewBox="0 0 24 24"><path d="M4 7V5h13v2M10.5 5L8 19M6 19h5"/><line x1="15" y1="14" x2="21" y2="20"/><line x1="21" y1="14" x2="15" y2="20"/></svg>
      </button>
    </div>
    <div class="rb-group" data-group="para">
      <button class="rb-btn" data-cmd="insertUnorderedList" id="rb-ul" title="Aufzählungszeichen">
        <svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>
      </button>
      <button class="rb-btn" data-cmd="insertOrderedList" id="rb-ol" title="Nummerierung">
        <svg viewBox="0 0 24 24"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 4h1v4M4 8h2" stroke-width="1.6"/><path d="M4 12.5c0-.8.6-1.4 1.2-1.4s1.2.5 1.2 1.1c0 1-2.4 1.7-2.4 2.8h2.4" stroke-width="1.6"/></svg>
      </button>
      <button class="rb-btn split" data-cmd="popNumber" id="rb-ol-more" title="Nummerierungsoptionen: Format, Startnummer, Nummer eines Punktes ändern">
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="rb-btn" data-cmd="outdent" title="Listenebene verringern">
        <svg viewBox="0 0 24 24"><line x1="21" y1="6" x2="11" y2="6"/><line x1="21" y1="12" x2="11" y2="12"/><line x1="21" y1="18" x2="11" y2="18"/><polyline points="7 8 3 12 7 16"/></svg>
      </button>
      <button class="rb-btn" data-cmd="indent" title="Listenebene erhöhen">
        <svg viewBox="0 0 24 24"><line x1="21" y1="6" x2="11" y2="6"/><line x1="21" y1="12" x2="11" y2="12"/><line x1="21" y1="18" x2="11" y2="18"/><polyline points="3 8 7 12 3 16"/></svg>
      </button>
      <button class="rb-btn" data-cmd="justifyLeft" id="rb-jl" title="Linksbündig">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="10" x2="15" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
      </button>
      <button class="rb-btn" data-cmd="justifyCenter" id="rb-jc" title="Zentriert">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="10" x2="18" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="6" y1="18" x2="18" y2="18"/></svg>
      </button>
      <button class="rb-btn" data-cmd="justifyRight" id="rb-jr" title="Rechtsbündig">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="10" x2="21" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="9" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="rb-btn" data-cmd="justifyFull" id="rb-jf" title="Blocksatz">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <select class="rb-select lh" id="rb-lh" title="Zeilenabstand">
        <option value="1">1,0</option>
        <option value="1.15">1,15</option>
        <option value="1.25">1,25</option>
        <option value="1.5">1,5</option>
        <option value="2">2,0</option>
      </select>
    </div>
    <div class="rb-group" data-group="arrange">
      <button class="rb-btn" data-cmd="front" title="In den Vordergrund">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1.5" fill="currentColor" fill-opacity=".25"/><path d="M5 15V5a1 1 0 011-1h10"/></svg>
      </button>
      <button class="rb-btn" data-cmd="back" title="In den Hintergrund">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="11" height="11" rx="1.5" fill="currentColor" fill-opacity=".25"/><path d="M19 9v10a1 1 0 01-1 1H8"/></svg>
      </button>
      <button class="rb-btn" data-cmd="duplicate" title="Duplizieren (Strg+D)">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>
      </button>
      <button class="rb-btn" data-cmd="delete" title="Löschen (Entf)">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>
      </button>
    </div>
    <div class="rb-group" data-group="history">
      <button class="rb-btn" data-cmd="undo" id="rb-undo" title="Rückgängig (Strg+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>
      </button>
      <button class="rb-btn" data-cmd="redo" id="rb-redo" title="Wiederholen (Strg+Y)">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>
      </button>
      <span class="rb-status" id="rb-status"></span>
    </div>
  </div>

  <div id="appbar">
    <button class="tb-btn" id="btn-edit" onclick="toggleEdit()" title="Bearbeitungsmodus (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <span id="btn-edit-label">Bearbeiten</span>
    </button>
    <button class="tb-btn" id="btn-save" onclick="saveDataWithFeedback()" title="Speichern (Strg+S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span class="tb-label-opt">Speichern</span>
    </button>
    <button class="tb-btn" onclick="toggleFullscreen()" title="Vollbild (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
    </button>
    <button class="tb-btn" id="btn-protocol" onclick="openProtocol()" title="Alle Folien als Protokoll (PDF) speichern und per Mail senden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      <span class="tb-label-opt">Protokoll</span>
    </button>
    <button class="tb-btn" onclick="exportData()" title="Export – Daten &amp; Bilder sichern">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="tb-btn" onclick="document.getElementById('import-file-input').click()" title="Import – Daten &amp; Bilder laden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <input type="file" id="import-file-input" style="display:none" onchange="importData(event)"/>
  </div>
</div>

<!-- Colour pop-overs -->
<div class="rb-pop" id="pop-color">
  <div class="pop-title">Schriftfarbe</div>
  <div class="sw-grid" id="sw-color"></div>
  <label class="pop-more">Weitere Farben …<input type="color" id="color-more" value="#003F87"/></label>
</div>
<div class="rb-pop" id="pop-number">
  <div class="pop-title">Nummerierung</div>
  <div class="num-fmt">
    <button class="nf" data-olfmt="decimal" title="1. 2. 3.">1. 2. 3.</button>
    <button class="nf" data-olfmt="lower-alpha" title="a. b. c.">a. b. c.</button>
    <button class="nf" data-olfmt="upper-alpha" title="A. B. C.">A. B. C.</button>
    <button class="nf" data-olfmt="lower-roman" title="i. ii. iii.">i. ii. iii.</button>
    <button class="nf" data-olfmt="upper-roman" title="I. II. III.">I. II. III.</button>
  </div>
  <label class="num-row">Liste beginnt mit<input type="number" id="ol-start" min="0" max="9999"/></label>
  <label class="num-row">Nummer dieses Punktes<input type="number" id="ol-item" min="0" max="9999"/></label>
  <div class="num-actions">
    <button class="nf wide" data-olact="continue">Nummerierung der Liste darüber fortsetzen</button>
    <button class="nf wide" data-olact="restart">Ab diesem Punkt neu mit 1 beginnen</button>
    <button class="nf wide danger" data-olact="remove">Nummer bei diesem Punkt entfernen</button>
  </div>
  <div class="num-hint">Enter in leerer Zeile beendet die Liste · Rücktaste am Zeilenanfang entfernt die Nummer · Tab / Umschalt+Tab = Unterpunkt</div>
</div>
<div class="rb-pop" id="pop-hilite">
  <div class="pop-title">Hervorhebung</div>
  <div class="sw-grid" id="sw-hilite"></div>
</div>

<!-- Hidden file input for images -->
<input type="file" id="img-file-input" accept="image/*" multiple style="display:none"/>

<!-- Navigation -->
<button class="nav-btn hidden" id="btn-prev" onclick="navigate(-1)" title="Zurück">
  <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
</button>
<button class="nav-btn" id="btn-next" onclick="navigate(1)" title="Weiter">
  <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
</button>

<div id="fs-hint">F · Vollbild &nbsp;|&nbsp; ← → · Navigation &nbsp;|&nbsp; E · Bearbeiten</div>
<div id="toast"></div>

<div id="stage-wrap"><div id="slides"></div></div>

<!-- Protokoll (PDF) dialog -->
<div id="pdf-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Protokoll als PDF</h2>
      <button class="modal-close" onclick="closeProtocol()">✕</button>
    </div>
    <div class="modal-body" id="pdf-body"></div>
    <div class="modal-foot" id="pdf-foot" style="display:none">
      <button class="modal-btn secondary" onclick="downloadProtocol()">PDF speichern</button>
      <div style="display:flex;gap:8px">
        <button class="modal-btn secondary" id="pdf-mail" onclick="mailProtocol()">E-Mail öffnen</button>
        <button class="modal-btn primary" id="pdf-share" onclick="shareProtocol()">✉︎ Per Mail senden</button>
      </div>
    </div>
  </div>
</div>

<!-- PDF Import Modal -->
<div id="import-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-title">PDF importieren</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="parsing-spinner">PDF wird gelesen…</div>
    </div>
    <div class="modal-foot">
      <span class="modal-count" id="modal-count"></span>
      <div style="display:flex;gap:8px">
        <button class="modal-btn secondary" onclick="closeModal()">Abbrechen</button>
        <button class="modal-btn primary" id="modal-confirm" onclick="confirmImport()">Importieren</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── AGENDA ───────────────────────────────────────────────────
const AGENDA = [
  { id:"begruess", num:"01", title:"Begrüßung",                    sub:"Willkommen & Eröffnung der Sitzung", type:"normal",
    icon:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>' },
  { id:"geburts",  num:"02", title:"Geburtstage",                  sub:"Glückwünsche & Jubiläen",            type:"birthdays",
    icon:'<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>' },
  { id:"themen",   num:"03", title:"Meetingthemen",                sub:"Infos und Themenpunkte",             type:"normal",
    icon:'<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>' },
  { id:"status",   num:"04", title:"Projekte und Veranstaltungen", sub:"Aktueller Sachstand & Updates",      type:"normal",

function wheelPath(c){
  const cx=50,cy=50,Ro=47,Ri=37.5,Rs=29.5,Rsi=11,Rh=6.5,PI2=Math.PI*2;
  const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];
  let g="",h=`M ${pt(Rs,0).join(",")}`;
  for(let i=0;i<24;i++){const b=(PI2/24)*i-Math.PI/2,d=(PI2/24)*.28;
    if(i===0)g+=`M ${pt(Ri,b-d*1.6).join(",")}`;else g+=` L ${pt(Ri,b-d*1.6).join(",")}`;
    g+=` L ${pt(Ro,b-d).join(",")} L ${pt(Ro,b+d).join(",")} L ${pt(Ri,b+d*1.6).join(",")}`;}
  g+=" Z";
  for(let i=72;i>=0;i--)h+=` L ${pt(Rs,(PI2/72)*i).join(",")}`;h+=" Z";
  let sp="";const sw=6.8;
  for(let i=0;i<6;i++){const a=(PI2/6)*i-Math.PI/2,cos=Math.cos(a),sin=Math.sin(a),nx=-sin,ny=cos,wo=sw*.45,wi=sw*.65;
    const p=(r,dx,dy)=>[(cx+r*cos+dx).toFixed(1),(cy+r*sin+dy).toFixed(1)].join(",");
    sp+=`<polygon points="${p(Rsi,nx*wi,ny*wi)} ${p(Rsi,-nx*wi,-ny*wi)} ${p(Rs,-nx*wo,-ny*wo)} ${p(Rs,nx*wo,ny*wo)}" fill="${c}"/>`;}
  return `<path d="${g} ${h}" fill="${c}" fill-rule="evenodd"/>${sp}<circle cx="${cx}" cy="${cy}" r="${Rsi}" fill="${c}"/><circle cx="${cx}" cy="${cy}" r="${Rh}" fill="white"/>`;
}

// ── DATE HELPERS ─────────────────────────────────────────────
const now = new Date();
const DAYS   = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTHS_SHORT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function todayLabel() {
  const d = new Date();
  return `${DAYS[d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

// ── STAGE / CANVAS GEOMETRY ──────────────────────────────────
// The slide is a fixed 1280×720 px stage (= PowerPoint 16:9 at 96 dpi).
// Content slides have a free "canvas" between header (104 px) and footer (36 px).
const STAGE_W = 1280, STAGE_H = 720;
const CANVAS_W = 1280, CANVAS_H = 580, MARGIN = 48;
const PT = 4 / 3;              // px per typographic point on the stage
const DEFAULT_PT = 24;         // default body text size (readable from the back row)
const SIZE_STEPS = [8,9,10,10.5,11,12,14,16,18,20,24,28,32,36,40,44,48,54,60,66,72,80,88,96,120];
const FONTS = [
  { label:'DM Sans',          css:"'DM Sans', sans-serif" },
  { label:'DM Serif Display', css:"'DM Serif Display', serif" },
  { label:'Arial',            css:"Arial, Helvetica, sans-serif" },
  { label:'Verdana',          css:"Verdana, Geneva, sans-serif" },
  { label:'Trebuchet MS',     css:"'Trebuchet MS', sans-serif" },
  { label:'Georgia',          css:"Georgia, serif" },
  { label:'Times New Roman',  css:"'Times New Roman', Times, serif" },
  { label:'Courier New',      css:"'Courier New', monospace" },
];
const TEXT_COLORS = ['#1A2B4A','#003F87','#17458F','#6FA8DC','#F7A81B','#C0392B','#E67E22','#1E8449','#7A8BA8','#000000','#FFFFFF','#5B2C6F','#0E6655','#B7950B','#566573'];

// ── STATE ─────────────────────────────────────────────────────
let current  = 0;
let editMode = false;
let data     = {};
let stageScale = 1;
const LS_KEY = 'rc_meeting_v5';

function newId() { return 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function defaultTextObj() {
  return { id: newId(), type: 'text', x: MARGIN, y: 28, w: CANVAS_W - 2 * MARGIN, h: CANVAS_H - 56, html: '', auto: true };
}
function slideObjs(sid) {
  if (!Array.isArray(data['objs_' + sid])) data['objs_' + sid] = [defaultTextObj()];
  return data['objs_' + sid];
}
function findObj(sid, id) { return slideObjs(sid).find(o => o.id === id) || null; }

// ── STORAGE ───────────────────────────────────────────────────
function loadData() {
  ['rc_meeting_v2','rc_meeting_v3','rc_meeting_v4'].forEach(old => {
    try {
      const prev = JSON.parse(localStorage.getItem(old) || 'null');
      if (prev) {
        const { birthdays: _ignored, ...rest } = prev;
        localStorage.setItem(LS_KEY, JSON.stringify(rest));
        localStorage.removeItem(old);
      }
    } catch {}
  });
  try { data = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch { data = {}; }
  if (migrateAll()) saveData();
}

// Converts every older content format into the object model
// data['objs_<slide>'] = [{id,type:'text'|'image',x,y,w,h,...}]  (px on the 1280×580 canvas)
function migrateAll() {
  let changed = false;
  AGENDA.filter(a => a.type === 'normal').forEach(a => {
    const key = 'objs_' + a.id;
    if (Array.isArray(data[key])) {
      const clean = data[key].filter(o => o && o.id && (o.type === 'text' || (o.type === 'image' && o.imgId)));
      if (clean.length !== data[key].length) { data[key] = clean; changed = true; }
      return;
    }
    const t = defaultTextObj();
    t.html = data['content_' + a.id] || '';
    const fs = parseFloat(data['fontsize_' + a.id]); if (fs) t.fs = fs;
    const ff = data['fontfamily_' + a.id];           if (ff) t.ff = ff;
    const objs = [t];
    const oldImgs = (data['fimgs_' + a.id] || []).filter(m => m && m.imgId);
    if (oldImgs.length) {
      t.w = 700;                                   // text left, pictures right
      oldImgs.forEach((m, i) => {
        const w = 420;
        objs.push({ id: newId(), type: 'image', imgId: m.imgId,
                    x: CANVAS_W - MARGIN - w - i * 24, y: 28 + i * 24, w, h: 315 });
      });
    }
    data[key] = objs;
    ['content_','fontsize_','fontfamily_','fimgs_'].forEach(p => delete data[p + a.id]);
    changed = true;
  });
  return changed;
}

function saveData() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    setStatus('saved');
    return true;
  } catch (e) {

  reader.onabort = () => toast('⚠ Lesen abgebrochen');
  reader.onload = async (ev) => {
    let bundle;
    try {
      let text = ev.target.result;
      if (typeof text === 'string' && text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      bundle = JSON.parse(text);
    } catch (parseErr) {
      toast('⚠ Ungültige JSON-Datei: ' + parseErr.message);
      return;
    }
    if (typeof bundle !== 'object' || bundle === null) { toast('⚠ Datei enthält keine gültigen Daten'); return; }

    try {

      const imgIds = Object.keys(images);
      let idbOk = true;
      for (const id of imgIds) {

      const { _images, ...rest } = bundle;
      data = rest;
      migrateAll();
      saveData();

      Object.keys(_imgCache).forEach(k => delete _imgCache[k]);
      hist.length = 0; redoStack.length = 0;
      sel = null;
      await preloadAllImages();
      await fixImageAspects();
      buildSlides();
      showSlide(0);

      toast(imgIds.length && !idbOk
        ? '✓ Daten geladen, aber Bilder konnten nicht gespeichert werden'
        : `✓ Import erfolgreich${imgIds.length ? ' (' + imgIds.length + ' Bilder)' : ''}`);
    } catch (err) {
      toast('⚠ Import fehlgeschlagen: ' + (err.message || err));

async function extractPDFText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const allLines = [];

  for (let p = 1; p <= pdf.numPages; p++) {
    const page    = await pdf.getPage(p);
    const content = await page.getTextContent();

    // Group text items by y-coordinate (±3pt tolerance = same row)
    const rows = [];
    content.items.forEach(item => {
      if (!item.str.trim()) return;
      const y = item.transform[5]; // baseline y in PDF units
      const x = item.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row) { row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, str: item.str });
    });

    // Sort rows top-to-bottom (higher y = higher on page in PDF coords)
    rows.sort((a, b) => b.y - a.y);

    // Within each row: sort left-to-right, join with space
    rows.forEach(row => {
      row.items.sort((a, b) => a.x - b.x);
      const line = row.items.map(i => i.str).join(' ').trim();
      if (line) allLines.push(line);
    });
  }

  return allLines.join('\n');
}

async function loadPDFDoc(file) {
  const buf = await file.arrayBuffer();
  return pdfjsLib.getDocument({ data: buf }).promise;
}

// ── MEMBER PDF PARSER (MyRotary Mitglieder Übersicht) ─────────
function parseMemberPDF(text) {
  // Rejoin single-char line-overflow (e.g. "Petschauer-Thiemi\ng")
  const rawLines = text.split('\n');
  const lines = [];
  rawLines.forEach(l => {
    const t = l.trim();
    if (!t) return;
    if (/^[a-z\u00e4\u00f6\u00fc\u00df]{1,4}$/.test(t) && lines.length)
      lines[lines.length - 1] += t;  // rejoin overflow char
    else lines.push(t);
  });

  const members = [], seen = new Set();

  lines.forEach(line => {
    // Skip header and footer lines
    if (/Nachname|Vorname|Geburts-Datum|Zugeh/i.test(line)) return;
    if (/Mitglieder.*bersicht|\d+\s*\/\s*\d+/i.test(line)) return;

    // Find the birth date
    const dm = line.match(/(\d{2}\.\d{2}\.\d{4})/);
    if (!dm) return;
    const d = parseDate(dm[1]);
    if (!d) return;

    // Text before date: "Nachname Vorname [any titles...]"
    // Strategy: take ONLY the first two words — that is always Nachname + Vorname
    // Academic titles appear AFTER the Vorname, we simply ignore them
    const before = line.slice(0, line.indexOf(dm[1]))
      .replace(/\bFoto\b|\bAktivmitglied\b/gi, '')
      .trim();

    const words = before.split(/\s+/).filter(Boolean);
    if (words.length < 2) return;

    // Handle hyphenated surname split across PDF lines:
    // "Brade-Schwegler" arrives as ["Brade-", "Schwegler", "Dorit"]
    // → merge trailing-hyphen word with the next one
    let wi = 0;
    let nachname = words[wi++];
    while (nachname.endsWith('-') && wi < words.length) {
      nachname += words[wi++];
    }
    if (wi >= words.length) return; // no Vorname left
    let vorname = words[wi];

    nachname = nachname.replace(/[,.]$/, '');
    vorname  = vorname.replace(/[,.]$/, '');

    // Sanity: both must look like real name parts (uppercase start, ≥2 chars)
    if (!/^[A-Z\u00c4\u00d6\u00dc][a-z\u00e4\u00f6\u00fc\u00df-]/.test(nachname)) return;
    if (!/^[A-Z\u00c4\u00d6\u00dc][a-z\u00e4\u00f6\u00fc\u00df-]/.test(vorname))  return;

    const name = vorname + ' ' + nachname;
    const key  = name + dm[1];
    if (seen.has(key)) return;
    seen.add(key);

    members.push({
      name, nachname, vorname,
      initials: (vorname[0] + nachname[0]).toUpperCase(),
      ...d, photo: null
    });
  });

  return members.sort((a,b) => a.month !== b.month ? a.month-b.month : a.day-b.day);
}


// ── PHOTO EXTRACTOR via PDF canvas rendering ──────────────────
async function extractPhotosFromPDF(pdfDoc, members) {
  const byDate = {};

  for (let pn = 1; pn <= pdfDoc.numPages; pn++) {
    const page  = await pdfDoc.getPage(pn);
    const scale = 3;                                // higher = sharper photos
    const vp    = page.getViewport({ scale });

    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    const ctx = canvas.getContext('2d');

    const tc = await page.getTextContent();

    // Collect all date items with Y positions, sorted top→bottom
    const dateItems = tc.items
      .filter(i => /^\d{2}\.\d{2}\.\d{4}$/.test(i.str.trim()))
      .map(i => ({ str: i.str.trim(), pdfY: i.transform[5] }))
      .sort((a, b) => b.pdfY - a.pdfY);

    if (!dateItems.length) continue;

    // Calculate row height from Y gaps between adjacent dates
    let rowPt = 26;
    if (dateItems.length >= 2) {
      const gaps = [];
      for (let i = 0; i < dateItems.length - 1; i++)
        gaps.push(Math.abs(dateItems[i].pdfY - dateItems[i+1].pdfY));
      const sorted = [...gaps].filter(g => g > 5 && g < 50).sort((a,b) => a-b);
      if (sorted.length) rowPt = sorted[Math.floor(sorted.length / 2)];
    }

    const pdfH = vp.height / scale;

    dateItems.forEach(({ str, pdfY }) => {
      const baselineY = (pdfH - pdfY) * scale; // canvas Y of text baseline

      // Photo is ABOVE the text baseline, in the left "Foto" column
      // Try multiple vertical offsets to find best photo crop
      const rowH    = rowPt * scale;
      const photoW  = Math.round(52 * scale);  // Foto column ~52pt wide
      const photoH  = Math.round(rowPt * 0.88 * scale);

      // Scan vertical offsets: photo could be anywhere from baseline upward
      const offsets = [0.92, 0.75, 1.05, 0.60]; // fraction of rowH above baseline
      let bestCrop = null, bestDark = 0;

      for (const off of offsets) {
        const py = Math.round(baselineY - rowH * off);
        if (py < 0 || py + photoH > canvas.height) continue;

        const imgData = ctx.getImageData(8, py, photoW, photoH).data;
        let dark = 0;
        for (let i = 0; i < imgData.length; i += 4)
          if ((imgData[i] + imgData[i+1] + imgData[i+2]) / 3 < 210) dark++;

        if (dark > bestDark) { bestDark = dark; bestCrop = py; }
      }

      // Need at least 5% non-white pixels
      if (!bestCrop || bestDark / (photoW * photoH) < 0.05) return;

      const thumb = document.createElement('canvas');
      thumb.width = thumb.height = 64;
      const tc2 = thumb.getContext('2d');
      tc2.fillStyle = '#dce5f4';
      tc2.fillRect(0, 0, 64, 64);
      tc2.drawImage(canvas, 8, bestCrop, photoW, photoH, 0, 0, 64, 64);

      byDate[str] = thumb.toDataURL('image/jpeg', 0.88);
    });
  }

  members.forEach(m => {
    const k = `${String(m.day).padStart(2,'0')}.${String(m.month).padStart(2,'0')}.${m.year}`;
    if (byDate[k]) m.photo = byDate[k];
  });
  return members;
}

// ── BIRTHDAY EXTRACTOR ───────────────────────────────────────
function extractBirthdays(text) {
  // Detect MyRotary Mitglieder Übersicht format
  if (text.includes('Geburts-Datum') || (text.includes('Nachname') && text.includes('Vorname') && text.includes('Aktivmitglied'))) {
    return parseMemberPDF(text);
  }
  // Generic fallback: scan for Name + DD.MM.YYYY patterns
  const results = [], seen = new Set();
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const monthMap = {jan:1,feb:2,'mär':3,mar:3,apr:4,mai:5,may:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dez:12,dec:12};
  lines.forEach(line => {
    const dm = line.match(/(\d{2}\.\d{2}\.\d{4})/);
    if (!dm) return;
    const d = parseDate(dm[1]);
    if (!d) return;
    const before = line.slice(0, line.indexOf(dm[1])).trim();
    const words  = before.split(/\s+/).filter(Boolean);
    if (words.length < 2) return;
    const nachname = words[0].replace(/[,.]$/,'');
    const vorname  = words[1].replace(/[,.]$/,'');
    if (!/^[A-ZÄÖÜ]/.test(nachname) || !/^[A-ZÄÖÜ]/.test(vorname)) return;
    const name = `${vorname} ${nachname}`;
    const key  = name + dm[1];
    if (seen.has(key)) return;
    seen.add(key);
    results.push({ name, nachname, vorname, initials:`${vorname[0]}${nachname[0]}`.toUpperCase(), ...d, photo:null });
  });
  return results.sort((a,b) => a.month !== b.month ? a.month-b.month : a.day-b.day);
}

// ── DATE STRING PARSER ───────────────────────────────────────
// Supports: DD.MM.YYYY, DD/MM/YYYY, YYYY-MM-DD, DD. Monat YYYY, DD. Monat
function parseDate(str) {
  if (!str) return null;
  str = str.trim();
  let m;
  // DD.MM.YYYY or DD.MM.YY
  if ((m = str.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/)))
    return { day:+m[1], month:+m[2], year: m[3].length===2 ? 2000+parseInt(m[3]) : +m[3] };
  // YYYY-MM-DD
  if ((m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/)))
    return { day:+m[3], month:+m[2], year:+m[1] };
  // DD. Monat YYYY  or  DD. Monat
  const monthMap = {jan:1,feb:2,'mär':3,mar:3,apr:4,mai:5,may:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dez:12,dec:12};
  if ((m = str.match(/^(\d{1,2})\.\s*([A-Za-z\u00e4\u00f6\u00fc]+)\.?\s*(\d{4})?$/))) {
    const mon = monthMap[m[2].toLowerCase().slice(0,3)];
    if (mon) return { day:+m[1], month:mon, year: m[3] ? +m[3] : 0 };
  }
  return null;
}

// ── PDF ITEM EXTRACTOR (with x/y positions, for column-based parsing) ──
async function extractPDFItemsByPage(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items
      .map(i => ({ x0: i.transform[4], y0: i.transform[5], str: i.str.replace(/\u00a0/g, ' ').trim() }))
      .filter(i => i.str);
    pages.push(items);
  }
  return pages;
}

function extractEvents(text) {
  // Used only for the generic fallback path (non-MyRotary PDFs)
  if (text.includes('Termin-Übersicht') || text.includes('Datum Uhrzeit Ort Thema')) {
    return null; // signal: caller should use the column-based parser instead
  }
  return extractEventsGeneric(text);
}

// ── SPECIALIZED PARSER: MyRotary Termin-Übersicht (column/position based) ──
// Uses real x/y coordinates from the PDF so multi-line cells (e.g. "Sonderveran"
// + "staltung" wrapping across lines) never bleed into neighboring columns.
// Column x-ranges measured from the actual MyRotary export layout (in pt):
//   Ort   ≈ 139.5   Thema ≈ 233.3   Kat. ≈ 389.7   Referent/Protokollant/Leitung further right
function parseRotaryTerminPDFColumns(pages) {
  // Column x-ranges (pt) measured from the actual MyRotary export layout.
  // pdf.js gives Datum and Uhrzeit as TWO SEPARATE text items (unlike some
  // other extractors that merge them) — so we match them by shared y0.
  const DATUM_MIN = 20,  DATUM_MAX = 76;    // "01.07.2026"
  const UHRZEIT_MIN = 76, UHRZEIT_MAX = 130; // "18:00 - 21:00"
  const ORT_MIN = 130,    ORT_MAX = 226;     // Ort column
  const THEMA_MIN = 226,  THEMA_MAX = 387;   // Thema column (before Kat. ~389.7)
  const FOOTER_Y_GUARD = 40;                 // page footer / page-number text sits below this

  const STRIP_NOTES = [
    /\s*,?\s+weitere\s+Infos?\s+folgen.*/gi,
    /\s*-\s+weitere.*/gi,
    /\s+m[oö]glicherweise.*/gi,
    /,?\s+Näheres\s+folgt.*/gi,
  ];
  const PLACEHOLDER_ORT = /^(Infos\s+folgen|genaue\s+Zeit\s+und\s+Ort\s+folgen)$/i;

  const results = [];

  pages.forEach(items => {
    // Drop footer/page-number text so it can never leak into the last row's window
    const usable = items.filter(it => it.y0 > FOOTER_Y_GUARD);

    // Datum and Uhrzeit are separate items — pair them up by matching y0
    const datumItems = usable.filter(it =>
      it.x0 >= DATUM_MIN && it.x0 < DATUM_MAX && /^\d{2}\.\d{2}\.\d{4}$/.test(it.str));
    const uhrzeitItems = usable.filter(it =>
      it.x0 >= UHRZEIT_MIN && it.x0 < UHRZEIT_MAX && /^\d{2}:\d{2}\s*-\s*\d{2}:\d{2}$/.test(it.str));

    const dateRows = [];
    datumItems.forEach(di => {
      const ti = uhrzeitItems.find(t => Math.abs(t.y0 - di.y0) < 1.5);
      if (!ti) return;
      const tm = ti.str.match(/^(\d{2}:\d{2})\s*-\s*(\d{2}:\d{2})$/);
      if (!tm) return;
      dateRows.push({ y0: di.y0, date: di.str, timeStart: tm[1], timeEnd: tm[2] });
    });
    dateRows.sort((a, b) => b.y0 - a.y0); // top → bottom

    dateRows.forEach((row, i) => {
      const yTop = row.y0 + 0.5;
      const yBottom = i + 1 < dateRows.length ? dateRows[i+1].y0 : 0;

      const inWindow = usable.filter(it => it.y0 <= yTop && it.y0 > yBottom);

      const ortParts = inWindow
        .filter(it => it.x0 >= ORT_MIN && it.x0 < ORT_MAX)
        .sort((a,b) => b.y0 - a.y0).map(it => it.str);
      const themaParts = inWindow
        .filter(it => it.x0 >= THEMA_MIN && it.x0 < THEMA_MAX)
        .sort((a,b) => b.y0 - a.y0).map(it => it.str);

      let loc = ortParts.join(' ').replace(/\s{2,}/g, ' ').trim();
      let title = themaParts.join(' ').replace(/\s{2,}/g, ' ').trim();

      for (const rx of STRIP_NOTES) title = title.replace(rx, '');
      title = title.replace(/[-,;]\s*$/, '').trim();

      if (PLACEHOLDER_ORT.test(loc)) loc = '';

      if (!title) return;
      const d = parseDate(row.date);
      if (!d) return;

      results.push({
        title, ...d,
        timeStart: row.timeStart,
        timeEnd: row.timeEnd,
        time: `${row.timeStart} – ${row.timeEnd}`,
        loc
      });
    });
  });

  return results.sort((a,b) => new Date(a.year,a.month-1,a.day) - new Date(b.year,b.month-1,b.day));
}

// ── GENERIC FALLBACK EXTRACTOR ────────────────────────────────
function extractEventsGeneric(text) {
  const results = [];
  const seen = new Set();
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const monthNames = 'Januar|Februar|März|Maerz|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember';
  const monthMap = {januar:1,februar:2,'märz':3,maerz:3,april:4,mai:5,juni:6,juli:7,august:8,september:9,oktober:10,november:11,dezember:12};

  lines.forEach(line => {
    const rA = new RegExp(`(\\d{1,2})[.\\s]+(${monthNames})\\.?\\s*(\\d{4})?\\s*(\\d{1,2}[.:h]\\d{2})?\\s*Uhr?\\s*(.+)?`, 'i');
    const rB = /(\d{1,2})\.(\d{1,2})\.(\d{4})\s*(?:(\d{1,2}[.:h]\d{2})\s*Uhr?)?\s*(.+)?/i;
    const rC = /^(.+?)\s+(\d{1,2})\.(\d{1,2})\.(\d{4})/i;
    let m;
    if ((m = rA.exec(line))) {
      const mon = monthMap[m[2].toLowerCase()];
      const title = m[5]?.trim();
      if (mon && title?.length > 2) {
        const key = `${m[1]}_${mon}_${m[3]||''}`;
        if (!seen.has(key)) { seen.add(key); results.push({ title, day:+m[1], month:mon, year:m[3]?+m[3]:now.getFullYear(), time:m[4]||'', loc:'' }); }
      }
    } else if ((m = rB.exec(line))) {
      const title = m[5]?.trim();
      if (title?.length > 2) {
        const key = `${m[1]}_${m[2]}_${m[3]}`;
        if (!seen.has(key)) { seen.add(key); results.push({ title, day:+m[1], month:+m[2], year:+m[3], time:m[4]||'', loc:'' }); }
      }
    } else if ((m = rC.exec(line))) {
      const key = `${m[2]}_${m[3]}_${m[4]}`;
      if (!seen.has(key)) { seen.add(key); results.push({ title:m[1].trim(), day:+m[2], month:+m[3], year:+m[4], time:'', loc:'' }); }
    }
  });
  return results.sort((a,b) => new Date(a.year,a.month-1,a.day) - new Date(b.year,b.month-1,b.day));
}

// Open modal, parse PDF
async function openPDFImport(file, mode) {
  modalMode = mode;
  const modal = document.getElementById('import-modal');
  const body  = document.getElementById('modal-body');
  document.getElementById('modal-title').textContent =
    mode === 'birthdays' ? '🎂 Geburtstage aus PDF importieren' : '📅 Termine aus PDF importieren';
  document.getElementById('modal-confirm').disabled = true;
  body.innerHTML = '<div class="parsing-spinner">PDF wird gelesen…</div>';
  modal.classList.add('open');

  try {
    body.innerHTML = '<div class="parsing-spinner">PDF wird gelesen…</div>';
    const rawText = await extractPDFText(file);
    let parsed;

    if (mode === 'birthdays') {
      parsed = extractBirthdays(rawText);
      // For member list PDFs: also extract photos
      if (rawText.includes('Geburts-Datum')) {
        body.innerHTML = '<div class="parsing-spinner">Fotos werden extrahiert…</div>';
        try {
          const pdfDoc = await loadPDFDoc(file);
          parsed = await extractPhotosFromPDF(pdfDoc, parsed);
        } catch(photoErr) {
          console.warn('Photo extraction failed:', photoErr);
        }
      }
    } else {
      // mode === 'events'
      if (rawText.includes('Termin-Übersicht') || rawText.includes('Datum Uhrzeit Ort Thema')) {
        // MyRotary format → use precise column/position-based parser
        body.innerHTML = '<div class="parsing-spinner">Termine werden zugeordnet…</div>';
        const pagesItems = await extractPDFItemsByPage(file);
        parsed = parseRotaryTerminPDFColumns(pagesItems);
      } else {
        parsed = extractEventsGeneric(rawText);
      }
    }

    pendingItems = parsed;
    renderModalContent(rawText, parsed, mode);
  } catch(e) {
    document.getElementById('modal-body').innerHTML = `
      <p style="color:#c0392b;font-size:13px">Fehler beim Lesen des PDFs: ${e.message}</p>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Bitte prüfe ob das PDF nicht passwortgeschützt ist.</p>`;
  }
}
